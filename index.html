<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumbling-Star</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tumbling-Star">
<meta name="theme-color" content="#FAF8F3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* Font ships with the app: it has to render in the gym without a network,
   and a store app must not depend on Google delivering a file. Baloo 2 is a
   variable font under the SIL Open Font License, so one file covers both
   weights we use. */
@font-face{
  font-family:'Baloo 2'; font-style:normal; font-weight:400 800;
  font-display:swap; src:url('fonts/baloo2.woff2') format('woff2');
  /* Latin only. Without this the font claims every character including the
     emoji we rely on, and iOS renders them as empty boxes instead of falling
     back to the system emoji font. */
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
    U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root{
  --bg:#FAF8F3; --ink:#191621; --sub:#8A8194;
  --gold:#C9A227; --goldSoft:#E7C463; --goldPale:#FFF6DB; --warn:#E2654F;
  --card:#FFFFFF; --line:#E8E2D2; --shadow:#E8E2D2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* The native app has no browser chrome, so the page itself must be the
   scroll container and reach full height. */
html{height:100%; -webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg); color:var(--ink);
  font-family:'Baloo 2', ui-rounded, 'Nunito', 'Segoe UI', system-ui, sans-serif,
    'Apple Color Emoji', 'Segoe UI Emoji';
}
#app{max-width:460px; margin:0 auto; padding:16px 14px 44px;
  padding-top:calc(16px + env(safe-area-inset-top));}
h1{text-align:center; font-size:30px; font-weight:800; margin:4px 0 0}
.sub{text-align:center; color:var(--sub); margin:2px 0 14px; font-size:14px}
/* color:inherit — iOS paints buttons in the system link blue otherwise */
button{font-family:inherit; color:inherit; cursor:pointer}
.tabs{display:flex; gap:6px; margin-bottom:14px}
.tab{flex:1; padding:10px 2px; border-radius:14px; border:none; font-size:12.5px;
  font-weight:800; background:#EFECE4; color:var(--ink); box-shadow:0 3px 0 #DDD6C6;
  white-space:nowrap}
.tab.on{background:var(--ink); color:var(--goldSoft); box-shadow:0 3px 0 var(--gold)}
.daycard{width:100%; text-align:left; border:1.5px solid var(--line); border-radius:20px;
  padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:12px}
.daycard .em{font-size:34px}
.daycard .nm{font-size:18px; font-weight:900; display:block}
.daycard .in{font-size:13px; color:var(--sub)}
.daycard .ar{margin-left:auto; font-size:22px}
.sectitle{color:var(--ink); border-radius:12px; padding:8px 12px; font-weight:800;
  font-size:15px; margin:16px 0 8px}
.item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:11px 12px;
  margin-bottom:7px; box-shadow:0 3px 0 var(--shadow)}
.item.done{background:#F1FBF3; box-shadow:0 3px 0 #BFE3C6}
.item.done .circle{animation:pop .32s ease-out}
@keyframes pop{
  0%{transform:scale(.6)} 55%{transform:scale(1.25)} 100%{transform:scale(1)}
}
.circle{min-width:26px; height:26px; border-radius:50%; background:#fff; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900}
.item.done .circle{background:#4C9A5F; border-color:#4C9A5F !important}
.iname{font-weight:800; font-size:14.5px; display:block}
.item.done .iname{text-decoration:line-through; opacity:.6}
.inote{font-size:12.5px; color:var(--sub)}
.lvl{font-size:10.5px; font-weight:900; color:var(--ink); border-radius:999px;
  padding:2px 7px; margin-left:6px; vertical-align:middle; display:inline-block}
.timerbtn{margin-left:auto; border:none; border-radius:999px; padding:6px 12px;
  font-weight:800; font-size:13px; color:var(--ink); white-space:nowrap}
.bigbtn{width:100%; padding:14px; border-radius:16px; border:none; font-size:17px;
  font-weight:800; color:var(--goldSoft); margin-top:14px; background:var(--ink);
  box-shadow:0 4px 0 var(--gold)}
.safety{background:var(--goldPale); border:2px solid var(--gold); border-radius:16px;
  padding:12px 14px; font-size:13.5px; line-height:1.5; margin-top:16px; color:#5A4A16}
.back{border:none; background:none; font-weight:800; font-size:14px;
  color:var(--sub); padding:2px 0 8px}
.dayhead{border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:10px;
  border:1.5px solid var(--line)}
.pbar{height:10px; background:#F2EEE3; border-radius:999px; margin-top:6px; overflow:hidden}
.pfill{height:100%; border-radius:999px; transition:width .25s}
.overlay{position:fixed; inset:0; background:rgba(25,22,33,.92); display:flex;
  flex-direction:column; align-items:center; justify-content:center; z-index:50;
  text-align:center;
  /* full screen inside the native app: keep clear of notch and home indicator */
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.ring{width:190px; height:190px; border-radius:50%; display:flex;
  align-items:center; justify-content:center}
.ringin{width:158px; height:158px; border-radius:50%; background:var(--ink);
  color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center}
.tnum{font-size:56px; font-weight:900}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:20px;
  padding:14px 14px 6px; box-shadow:0 4px 0 var(--shadow)}
.wrow{display:flex; align-items:center; margin-bottom:10px}
.wlabel{color:var(--ink); border-radius:10px; padding:7px 10px; font-weight:900;
  font-size:13px; min-width:74px; text-align:center}
.slots{display:flex; gap:8px; margin-left:10px}
.slot{width:52px; height:46px; border-radius:12px; border:2px dashed #DDD6C6;
  background:#F7F4EC; font-size:14px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; line-height:1; color:#C4BBA8}
.slot.full{border-color:transparent; background:var(--goldPale); font-size:22px; color:inherit}
.slot.full small{font-size:10px; font-weight:900; color:var(--sub)}
.goldbox{background:var(--goldPale); border-radius:18px; padding:14px 16px; margin-top:14px;
  box-shadow:0 4px 0 var(--gold); text-align:center}
.track{background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  padding:10px 12px; margin-bottom:7px;
  box-shadow:0 3px 0 var(--shadow); display:flex; align-items:center; gap:10px}
.dots{display:flex; gap:4px; margin-top:5px; align-items:center}
.dot{width:10px; height:10px; border-radius:50%; background:#EDE8DC; display:inline-block}
.dot.on{background:var(--gold)}
.pm{border:none; border-radius:8px; width:30px; height:26px; font-weight:900;
  background:#EFECE4; color:var(--ink)}
.reset{border:none; background:none; color:var(--sub); font-size:12.5px;
  text-decoration:underline}
.reset2{border:none; background:var(--warn); color:#fff; font-weight:800; font-size:13px;
  border-radius:999px; padding:8px 16px}
.demobtn{min-width:30px; height:30px; border-radius:50%; border:none; padding:0;
  background:#EFECE4; font-size:14px; display:flex; align-items:center; justify-content:center}
.democard{background:var(--card); border-radius:22px; padding:18px 18px 14px;
  max-width:320px; width:100%; color:var(--ink); text-align:center}
.demotips{text-align:left; margin:8px 0 0; padding-left:20px; font-size:14px;
  line-height:1.5; font-weight:600}
.demotips li{margin-bottom:4px}
.demo-svg{width:100%; max-width:250px; background:#F7F4EC; border-radius:16px}
.demo-vid{width:100%; max-width:250px; background:#F7F4EC; border-radius:16px; display:block;
  margin:0 auto; aspect-ratio:22/15; object-fit:cover}
.demo-svg .st{stroke:var(--ink); stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.demo-svg .stf{stroke:#C9C2B2; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.demo-svg .hd{fill:var(--ink)}
.demo-svg .gr{stroke:#E8E2D2; stroke-width:5; stroke-linecap:round}
.demo-svg .wl{stroke:#C4BBA8; stroke-width:8; stroke-linecap:round}
.demo-svg .blk{fill:#EAE4D6}
.demo-svg .ac{stroke:var(--gold); stroke-width:4; fill:none; stroke-linecap:round}
.demo-svg .act{fill:var(--gold)}
.lvlcard{background:var(--card); border:1.5px solid var(--line); border-radius:16px;
  margin-bottom:10px; box-shadow:0 3px 0 var(--shadow); overflow:hidden}
.lvlhead{display:flex; align-items:center; gap:10px; width:100%; border:none;
  background:none; padding:12px 14px; text-align:left}
.lvlbadge{color:var(--ink); border-radius:10px; padding:6px 10px; font-weight:900;
  font-size:13px; min-width:64px; text-align:center}
.catb{font-size:10px; font-weight:900; color:#fff; border-radius:999px; padding:2px 7px;
  margin-left:6px; display:inline-block; vertical-align:middle; white-space:nowrap}
.skillrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; padding:9px 14px; border-top:1.5px solid #F2EEE3}
.drillbtn{display:flex; align-items:center; gap:8px; width:100%; border:none;
  background:#F7F4EC; border-radius:12px; padding:9px 10px; margin-top:6px;
  text-align:left; font-weight:700; font-size:13.5px; color:var(--ink)}
.warnbox{background:var(--goldPale); border:2px solid var(--gold); border-radius:12px;
  padding:8px 10px; font-size:12.5px; font-weight:700; margin-top:10px; color:#5A4A16}
.lbl{font-size:14px; font-weight:800; margin:4px 2px 8px; color:var(--sub)}
.seg{display:flex; gap:6px; margin:0 0 12px}
.seg button{flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:12px; padding:9px 4px; font-weight:800; font-size:13px}
.seg button.on{background:var(--ink); color:var(--goldSoft); border-color:var(--ink)}
.extras{display:flex; gap:9px}
.extra{flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
  border:1.5px solid var(--line); background:var(--card); border-radius:16px; padding:11px 6px;
  box-shadow:0 3px 0 var(--gold); color:var(--ink)}
.extra b{font-size:13.5px}
.extra small{font-size:11.5px; color:var(--sub)}
.toprow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px}
.who{display:flex; align-items:center; gap:7px; border:1.5px solid var(--line);
  background:var(--card); border-radius:999px; padding:5px 12px 5px 9px; font-weight:800;
  font-size:13.5px; color:var(--ink); box-shadow:0 2px 0 var(--shadow)}
.helpcard{background:var(--card); border-radius:22px; padding:18px; max-width:340px; width:100%;
  color:var(--ink); text-align:left; max-height:78vh; overflow-y:auto}
.helpcard h3{margin:0 0 10px; font-size:19px}
.helpcard p{font-size:14px; line-height:1.5; margin:0 0 11px}
.helpcard p b{color:var(--ink)}
.pcard{background:var(--card); border-radius:22px; padding:16px; max-width:320px; width:100%;
  color:var(--ink); text-align:left}
.prow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1.5px solid var(--line);
  background:var(--card); border-radius:14px; padding:10px 12px; margin-bottom:7px; font-weight:800;
  font-size:15px; color:var(--ink)}
.prow.on{border-color:var(--gold); box-shadow:0 3px 0 var(--gold)}
.pmini{border:none; background:#EFECE4; border-radius:999px; padding:5px 9px; font-size:12px;
  font-weight:800; color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ Daten ============ */
const C = {gold:"#C9A227", ink:"#191621", warn:"#E2654F"};

const TRACKS = {
  bruecke:{label:"Brücke halten", stepAfter:2, levels:[
    {sec:10,note:"3 Durchgänge"},{sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"},
    {sec:25,note:"3 Durchgänge"},{sec:30,note:"3 Durchgänge"}]},
  handstand:{label:"Handstand an der Wand", stepAfter:2, levels:[
    {sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"},{sec:30,note:"3 Durchgänge"},
    {sec:40,note:"3 Durchgänge"},{sec:50,note:"3 Durchgänge"}]},
  hollow:{label:"Hollow Body (Bananenlage)", stepAfter:2, levels:[
    {sec:10,note:"3 Durchgänge"},{sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"},
    {sec:25,note:"3 Durchgänge"},{sec:30,note:"3 Durchgänge"}]},
  plank:{label:"Unterarmstütz (Plank)", stepAfter:2, levels:[
    {sec:20},{sec:30},{sec:45},{sec:60},{sec:75}]},
  superman:{label:"Superman (Bauchlage)", stepAfter:2, levels:[
    {sec:10,note:"3 Durchgänge"},{sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"},
    {sec:25,note:"3 Durchgänge"},{sec:30,note:"3 Durchgänge"}]},
  pushup:{label:"Liegestütze auf den Knien", stepAfter:2, levels:[
    {note:"2x 6"},{note:"2x 8"},{note:"2x 10"},{note:"2x 12"},{note:"3x 10"}]},
  /* Split progression runs on hold time — the long holds are what builds
     the depth. A pillow under the knee is an aid, not a training step. */
  spagat:{label:"Spagat üben", stepAfter:2, sides:true, levels:[
    {sec:20,note:"Kissen unterm Knie als Hilfe erlaubt"},
    {sec:25,note:"Kissen unterm Knie als Hilfe erlaubt"},
    {sec:30,note:"Kissen unterm Knie als Hilfe erlaubt"},
    {sec:35,note:"Kissen unterm Knie als Hilfe erlaubt"},
    {sec:40,note:"Kissen unterm Knie als Hilfe erlaubt"}]},
  bogengang:{label:"Bogengang-Linie", stepAfter:3, line:"lnBG", levels:[
    {name:"Brücke von der Erhöhung", note:"Sofa/Kasten, 5x"},
    {name:"Kick-over von der Erhöhung", note:"5 Versuche"},
    {name:"Bogengang rückwärts mit Spotter", note:"5 Versuche"},
    {name:"Bogengang mit wenig Hilfe", note:"5 Versuche"},
    {name:"Bogengang allein", note:"5 Versuche", gate:"m6"}]}
};
const TRACK_KEYS = Object.keys(TRACKS);

const DAYS = [
  {id:"A", name:"Brücken-Tag", emoji:"🌈", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", kind:"warm", items:[
      {name:"20 Hampelmänner"},
      {name:"Armkreisen groß", note:"10x vor + zurück"},
      {name:"Katze-Kuh auf der Matte", note:"8x langsam"},
      {name:"Handgelenke kreisen", note:"10x pro Seite"}]},
    {title:"Dehnen – lange halten!", kind:"stretch", items:[
      {name:"Schulterdehnung an der Wand", sec:30},
      {name:"Ausfallschritt-Dehnung", sec:30, sides:true},
      {name:"Kobra-Dehnung", sec:30},
      {track:"spagat"}]},
    {title:"Brücken-Drills", kind:"skill", items:[
      {track:"bruecke"},
      {name:"Brücke vor- und zurückwippen", note:"10x"},
      {name:"Brücke: Wand runterlaufen", note:"3x"},
      {track:"bogengang"}]},
    {title:"Abschluss", kind:"finish", items:[
      {name:"5x Rad – Landung stehen!", note:"Beine strecken"},
      {name:"3x Lieblingssprung", note:"Toe Touch / Tuck"},
      {name:"Sitz-Sprung-Haltung", note:"3x 3 Sek halten", minTL:2},
      {name:"Brücken-Kick-over", note:"3 Versuche, mit Spotter!", minTL:2}]}
  ]},
  {id:"B", name:"Kraft-Tag", emoji:"💪", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", kind:"warm", items:[
      {name:"Hopserlauf auf der Stelle", sec:30},
      {name:"Bärengang", note:"2x durchs Zimmer"},
      {name:"Schulterkreisen", note:"10x pro Richtung"},
      {name:"10 Kniebeugen"}]},
    {title:"Kraft", kind:"strength", items:[
      {track:"handstand"},{track:"hollow"},{track:"pushup"},{track:"superman"},{track:"plank"}]},
    {title:"Abschluss", kind:"finish", items:[
      {name:"Handstand-Versuche mit Spotter", note:"5 Versuche"},
      {name:"3x Radschlag sauber"},
      {name:"Tuck-Sprünge", note:"2x 5", minTL:2},
      {name:"Candlestick-to-Stand", note:"5x", minTL:3},
      {name:"Einbeiniger Absprung", note:"10x pro Seite", minTL:4}]},
    {title:"Dehnen – lange halten!", kind:"stretch", items:[
      {name:"Schmetterling-Sitz", sec:30},
      {name:"Beinrückseite dehnen", sec:30, sides:true},
      {name:"Handgelenk-Dehnung", sec:30}]}
  ]},
  {id:"C", name:"Technik-Tag", emoji:"🤸", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", kind:"warm", items:[
      {name:"20 Strecksprünge"},
      {name:"Toe-Touch-Vorbereitung", note:"5x locker"},
      {name:"Handgelenke kreisen", note:"10x pro Seite"},
      {name:"Katze-Kuh auf der Matte", note:"8x langsam"}]},
    {title:"Tumbling-Technik", kind:"skill", items:[
      {name:"5x Rad – Landung stehen!", note:"Beine strecken"},
      {name:"5x Radschlag sauber"},
      {name:"3x Radwende", note:"Füße zusammen landen"},
      {name:"Radwende + Strecksprung", note:"3x"},
      {name:"Spreizsprung (Star)", note:"3x", minTL:2},
      {name:"Pike-Sprung", note:"3x", minTL:3},
      {name:"Hurdler", note:"je Seite 3x", minTL:5},
      {name:"Sprung-Kombination", note:"2 Sprünge in Folge, 3x", minTL:5}]},
    {title:"Bogengang-Drills", kind:"skill", items:[
      {track:"bogengang"},
      {name:"Ein Bein in der Brücke heben", note:"je Bein 5x"}]},
    {title:"Dehnen – lange halten!", kind:"stretch", items:[
      {track:"spagat"},{track:"bruecke"},
      {name:"Schulterdehnung an der Wand", sec:30}]}
  ]}
];

/* check: goal is provably reached through track progress — the goals tab then
   suggests ticking it off (a parent still confirms, nothing auto-completes). */
const MILESTONES = [
  {id:"m1", name:"Brücke 15 Sekunden halten", check:()=>store.progress.bruecke.lvl>=2},
  {id:"m2", name:"Wand komplett runterlaufen"},
  {id:"m3", name:"Handstand 20 Sek. an der Wand", check:()=>store.progress.handstand.lvl>=2},
  {id:"m4", name:"Spagat fast ganz unten"},
  {id:"m5", name:"Bogengang mit wenig Hilfe", check:()=>store.progress.bogengang.lvl>=4},
  {id:"m6", name:"Trainer-Okay: Bogengang allein üben"}
];

/* CCVD level ladder (tumbling, derived from the CCVD rules summary sheet) + jump progression */
const FF_DRILLS = [
  {name:"Sitz-Sprung-Haltung", demo:"ffdrillsitz"},
  {name:"Handstütz-Schnepper an der Wand", demo:"ffdrillschnepper"},
  {name:"Brücken-Kick-over", demo:"ffdrillkickover"},
  {name:"Core-Spannung (Hollow)", demo:"hollow"}
];
const LEVELS = [
  {id:"L0", name:"Level 0", skills:[
    {id:"t0a", name:"Rolle vorwärts", cat:"heim", demo:"rollevw"},
    {id:"t0b", name:"Rolle rückwärts", cat:"heim", demo:"rollerw"},
    {id:"t0c", name:"Handstand an der Wand", cat:"heim", demo:"handstand"},
    {id:"t0d", name:"Rad", cat:"heim", demo:"rad"},
    {id:"t0e", name:"Radwende (einzeln)", cat:"heim", demo:"radwende"},
    {id:"t0f", name:"Brücke", cat:"heim", demo:"bruecke"}]},
  {id:"L1", name:"Level 1", skills:[
    {id:"t1a", name:"Bogengang rückwärts", cat:"heim", note:"mit Spotter!", demo:"bogengang"},
    {id:"t1b", name:"Bogengang vorwärts", cat:"heim", note:"mit Spotter!", demo:"bogengangvw"},
    {id:"t1c", name:"Brücke aus dem Stand + Aufstehen", cat:"heim", note:"mit Spotter!", demo:"brueckestand"},
    {id:"t1d", name:"Handstand-Abrollen", cat:"heim", demo:"handstandabrollen"}]},
  {id:"L2", name:"Level 2", skills:[
    {id:"t2a", name:"Rad-Radwende-Kombination", cat:"heim", demo:"radkombi"},
    {id:"t2b", name:"Standing Flick-Flack (1x)", cat:"drill", demo:"ff", drills:FF_DRILLS},
    {id:"t2c", name:"Running Flick-Flack nach Radwende", cat:"drill", demo:"ff", drills:FF_DRILLS}]},
  {id:"L3", name:"Level 3", skills:[
    {id:"t3a", name:"Flick-Flack-Serien", cat:"verein", demo:"ff"},
    {id:"t3b", name:"Sprung + Flick-Flack", cat:"verein", demo:"ff"},
    {id:"t3c", name:"Freies Rad (Aerial)", cat:"drill", demo:"aerial", drills:[
      {name:"Rad mit spätem Handaufsatz", demo:"aerialdrillspaet"},
      {name:"Rad über Erhöhung", demo:"aerialdrillerhoehung"},
      {name:"Einbeiniger Absprung", demo:"aerialdrillabsprung"}]},
    {id:"t3d", name:"3/4 Front Flip", cat:"verein", demo:"tuck"},
    {id:"t3e", name:"Running Flip gehockt", cat:"verein", note:"aus Radwende / RW-Flick-Flack", demo:"tuck"}]},

/* ============ Profiles ============ */
/* Siblings share one device, so each profile keeps its own progress and its
   own unfinished training. `store` always points at the active profile, which
   is why the rest of the app needs no knowledge of profiles at all. */
const KEY = "tumbling-star";            // single-profile save from before, migrated once
const PKEY = "tumbling-star-profiles";
const AVATARS = ["⭐","🌟","🤸","🌈","🦄","🐯","🦊","🐼","🦋","⚡"];

let profiles = [], activeId = null, store = null, profileMenu = false;

function blankStore(){
  const s = {stars:[], milestones:[], progress:{}, levels:{}, linesDone:{},
             tl:1, unit:{A:0,B:0,C:0}, extra:0, log:[]};
  TRACK_KEYS.forEach(k => s.progress[k] = {lvl:0, cnt:0});
  return s;
}
function normalize(s){
  s = Object.assign(blankStore(), s || {});
  if(!Array.isArray(s.log)) s.log = [];
  TRACK_KEYS.forEach(k => { if(!s.progress[k]) s.progress[k] = {lvl:0, cnt:0}; });
  if(!s.levels) s.levels = {};
  if(!s.linesDone) s.linesDone = {};
  if(!s.tl){
    s.tl = 1;
    s.unit = {A:0, B:0, C:0};
    (s.stars||[]).forEach(x => { if(s.unit[x.d]!=null && s.unit[x.d]<3) s.unit[x.d]++; });
  }
  return s;
}
function newId(){ return "p" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function activeProfile(){ return profiles.find(p=>p.id===activeId) || profiles[0]; }
function saveProfiles(){
  try { localStorage.setItem(PKEY, JSON.stringify({profiles, active:activeId})); } catch(e) {}
}
function saveStore(){ saveProfiles(); }

(function loadProfiles(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(PKEY) || "null"); } catch(e) {}
  if(d && Array.isArray(d.profiles) && d.profiles.length){
    profiles = d.profiles.map(p => ({id:p.id, name:p.name, emoji:p.emoji, data:normalize(p.data)}));
    activeId = profiles.some(p=>p.id===d.active) ? d.active : profiles[0].id;
  } else {
    let legacy = null;                   // keep the progress made before profiles existed
    try { legacy = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}
    profiles = [{id:newId(), name:legacy ? "Mein Training" : "", emoji:"⭐", data:normalize(legacy)}];
    activeId = profiles[0].id;
    saveProfiles();                       // an empty name triggers the welcome screen
  }
  store = activeProfile().data;
})();

let tab = "training", dayId = null, checked = {}, confirmReset = false;
let genPlan = null;                    // generated session, lives only while in use

/* A training run takes 25-30 minutes and phones drop the page all the time
   (lock screen, a call, low memory). Without this the child loses every tick
   and has to start over, so the running session survives a reload for 6h. */
const SKEY = () => "tumbling-star-session-" + activeId; // one unfinished training per profile
function checkedDay(){
  const on = Object.keys(checked).filter(k=>checked[k]);
  return on.length ? on[0].split("-")[0] : null; // item keys are "<day>-<section>-<index>"
}
function saveSession(){
  try {
    /* A generated session only exists in memory, so it travels with the
       session or it is lost on the next reload. */
    const d = checkedDay() || (dayId==="G" && genPlan ? "G" : null);
    if(d) localStorage.setItem(SKEY(), JSON.stringify({dayId:d, checked, t:Date.now(),
      plan: d==="G" ? genPlan : null}));
    else localStorage.removeItem(SKEY());
  } catch(e) {}
}
function loadSession(){
  checked = {}; dayId = null; genPlan = null;
  try {
    const s = JSON.parse(localStorage.getItem(SKEY()) || "null");
    if(s && s.dayId && Date.now() - s.t < 6*3600*1000){
      if(s.dayId === "G" && !s.plan) return;      // plan lost, nothing to resume
      dayId = s.dayId; checked = s.checked || {};
      if(s.plan) genPlan = s.plan;
    } else if(s) localStorage.removeItem(SKEY());
  } catch(e) {}
}

/* ============ Trainer connection (optional) ============ */
/* Off unless a child deliberately connects: the app works fully offline and
   nothing leaves the device until someone taps "Mit Trainer verbinden". The
   profile id doubles as the write secret, so no login and no email is needed.
   Empty SRV_URL means the sync server serves this page too, which is the case
   whenever a club runs its own; the public copy has no server behind it. */
const SRV_URL = "";
const SRV = SRV_URL || location.origin;
let pairCode = null, syncMsg = "";
function coachOn(){ return !!activeProfile().coach; }
function srv(path, body){
  return fetch(SRV+path, {method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify(body||{})})
    .then(r => r.json().then(j => r.ok ? j : Promise.reject(new Error(j.error||"Fehler"))));
}
function connectCoach(){
  const me = activeProfile();
  srv("/api/athlete", {id:me.id, name:me.name})
    .then(()=> srv("/api/sync", {id:me.id, name:me.name, data:store}))
    .then(()=> srv("/api/pair/code", {id:me.id}))
    .then(r=>{
      me.coach = true; saveProfiles();
      pairCode = r.code; syncMsg = ""; render();
    })
    .catch(()=>{
      syncMsg = "Hier gibt es keinen Trainer-Server. Öffne die App über die Adresse, "
        + "die dir dein Verein gegeben hat.";
      render();
    });
}
function syncNow(){
  const me = activeProfile();
  if(!me.coach) return Promise.resolve();
  return srv("/api/sync", {id:me.id, name:me.name, data:store})
    .then(()=>{ me.lastSync = Date.now(); saveProfiles(); })
    .catch(()=>{});                    // offline is normal, try again next time
}
function disconnectCoach(){
  const me = activeProfile();
  if(!confirm("Verbindung trennen und alle Daten beim Trainer löschen?")) return;
  srv("/api/athlete/forget", {id:me.id})
    .catch(()=>{})
    .then(()=>{ me.coach = false; me.lastSync = 0; pairCode = null;
      syncMsg = "Getrennt – deine Daten sind gelöscht."; saveProfiles(); render(); });
}
function closeCode(){ pairCode = null; render(); }

                     : 'Nach dem nächsten Training sieht er deinen Fortschritt.')+'</div>'

      + '<span style="color:var(--sub)"> · </span>'

    + '<div style="font-weight:900;font-size:15px">Trainer verbinden</div>'

        + esc(syncMsg)+'</div>' : '')

function switchProfile(id){
  if(id === activeId){ profileMenu = false; render(); return; }
  saveSession();                       // keep the current child's unfinished training
  stopTimer();

  loadSession();
  profileMenu = false;
  tab = "training";
  saveProfiles();

}
function addProfile(){
  const name = (prompt("Wie heißt du?") || "").trim();
  if(!name) return;
  const emoji = AVATARS[profiles.length % AVATARS.length];
  profiles.push({id:newId(), name:name.slice(0,20), emoji, data:blankStore()});
  saveProfiles();
  switchProfile(profiles[profiles.length-1].id);

function renameProfile(id, ev){
  if(ev) ev.stopPropagation();
  const p = profiles.find(x=>x.id===id); if(!p) return;
  const name = (prompt("Neuer Name:", p.name) || "").trim();
  if(name) p.name = name.slice(0,20);
  saveProfiles(); render();
}
function removeProfile(id, ev){
  if(ev) ev.stopPropagation();
  if(profiles.length < 2) return;      // never delete the last profile
  const p = profiles.find(x=>x.id===id); if(!p) return;
  if(!confirm('"'+p.name+'" mit allen Sternen und Stufen wirklich löschen?')) return;
  profiles = profiles.filter(x=>x.id!==id);
  try { localStorage.removeItem("tumbling-star-session-"+id); } catch(e) {}
  if(activeId === id){ activeId = profiles[0].id; store = activeProfile().data; loadSession(); }
  saveProfiles(); render();
}

/* ============ Demos (skeletal stick-figure animations) ============ */
/* Rigid skeleton: fixed segment lengths, poses = joint angles (deg, 0=right, 90=down).
   Facing is shown by the feet only: toe segment sits on the anterior side (l+k+90*fs). */
const SK = {torso:36, uparm:20, forearm:18, upleg:27, loleg:25};
const DD = Math.PI/180;
function pt(x,y,a,len){ return [x+len*Math.cos(a*DD), y+len*Math.sin(a*DD)]; }
function seg(x1,y1,x2,y2,cls){
  return '<line class="'+cls+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)
    +'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
}
function armSVG(nx,ny,a,b,cls){
  const [ex,ey] = pt(nx,ny,a,SK.uparm);
  const [hx,hy] = pt(ex,ey,a+b,SK.forearm);
  return seg(nx,ny,ex,ey,cls)+seg(ex,ey,hx,hy,cls);
}
function legSVG(px,py,l,k,fs,cls){
  const [kx,ky] = pt(px,py,l,SK.upleg);
  const [fx,fy] = pt(kx,ky,l+k,SK.loleg);
  const [tx,ty] = pt(fx,fy,l+k+90*fs,10);
  return seg(px,py,kx,ky,cls)+seg(kx,ky,fx,fy,cls)+seg(fx,fy,tx,ty,cls);
}
/* Cheer character renderer: 2D vector puppet in the team look (black/gold CHEER
   outfit, brown ponytail), driven by the same joint-angle poses. */
const CH = {skin:"#F0BE9B", skinSh:"#D8A57F", top:"#26222E", topSh:"#1B1824",
  gold:"#D9B454", hair:"#4A2E1C", shoe:"#FFFFFF", shoeSh:"#DCD5E6", line:"#3A2E3F"};
function capLine(x1,y1,x2,y2,w,color){
  return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)
    +'" y2="'+y2.toFixed(1)+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>';
}
/* outlined capsule: dark contour underneath, fill color on top */
function cap(x1,y1,x2,y2,w,color){
  return capLine(x1,y1,x2,y2,w+2.6,CH.line)+capLine(x1,y1,x2,y2,w,color);
}
function charLeg(px,py,l,k,fs,shade,f){
  const [kx,ky] = pt(px,py,l,SK.upleg);
  const [ax,ay] = pt(kx,ky,l+k,SK.loleg);
  const [sx,sy] = pt(kx,ky,l+k,SK.loleg*0.7);
  const toe = (f==null) ? l+k+90*fs : f; // explicit foot angle (mocap) wins
  const [tx,ty] = pt(ax,ay,toe,11);
  const skin = shade?CH.skinSh:CH.skin, shoe = shade?CH.shoeSh:CH.shoe;
  return cap(px,py,kx,ky,7.5,skin)+cap(kx,ky,ax,ay,6.5,skin)
    +cap(sx,sy,ax,ay,6.8,shoe)+cap(ax,ay,tx,ty,8,shoe);
}
function charArm(nx,ny,a,b,shade){
  const [ex,ey] = pt(nx,ny,a,SK.uparm);
  const [wx,wy] = pt(ex,ey,a+b,SK.forearm);
  const top = shade?CH.topSh:CH.top, skin = shade?CH.skinSh:CH.skin;
  return cap(nx,ny,ex,ey,7,top)+cap(ex,ey,wx,wy,5.5,skin)
    +'<circle cx="'+wx.toFixed(1)+'" cy="'+wy.toFixed(1)+'" r="3.6" fill="'+skin
    +'" stroke="'+CH.line+'" stroke-width="1.6"/>';
}
function charSkirt(p){
  const u = [Math.cos(p.t*DD), Math.sin(p.t*DD)];
  // hem direction: away from the torso, blended toward gravity so the skirt hangs
  let hx = -u[0], hy = -u[1]+0.8;
  const hl = Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
  const v = [-hy, hx];
  const A = [p.px+v[0]*8, p.py+v[1]*8], B = [p.px-v[0]*8, p.py-v[1]*8];
  const H = [p.px+hx*13, p.py+hy*13];
  const C = [H[0]-v[0]*15, H[1]-v[1]*15], E = [H[0]+v[0]*15, H[1]+v[1]*15];
  const pts = [A,B,C,E].map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  return '<polygon points="'+pts+'" fill="'+CH.top+'" stroke="'+CH.line+'" stroke-width="2.4" stroke-linejoin="round"/>'
    + capLine(C[0],C[1],E[0],E[1],3,CH.gold);
}
function eyeSVG(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="3.1" fill="#fff"/>'
    +'<circle cx="'+x+'" cy="'+(y+0.4)+'" r="2" fill="#5A3521"/>'
    +'<circle cx="'+(x+0.7)+'" cy="'+(y-0.4)+'" r="0.7" fill="#fff"/>';
}
function charHead(nx,ny,p){
  const rot = p.t+90+p.hd;
  const face = p.flat ? 0 : (p.fs1>=0 ? -1 : 1);
  const [hx,hy] = pt(nx,ny,p.t+p.hd,16);
  const pf = face===0 ? 0 : -face; // ponytail sits behind the face; hidden in front view
  let s = '<g transform="translate('+hx.toFixed(1)+' '+hy.toFixed(1)+') rotate('+(rot).toFixed(1)+')">';
  if(pf){
    s += '<path d="M'+(pf*8)+',-8 q'+(pf*11)+',3 '+(pf*12)+',16" stroke="'+CH.line
      +'" stroke-width="9.4" fill="none" stroke-linecap="round"/>';
    s += '<path d="M'+(pf*8)+',-8 q'+(pf*11)+',3 '+(pf*12)+',16" stroke="'+CH.hair
      +'" stroke-width="7" fill="none" stroke-linecap="round"/>';
  }
  s += '<circle cx="0" cy="-2.5" r="12.3" fill="'+CH.hair+'" stroke="'+CH.line+'" stroke-width="2.2"/>';
  s += '<circle cx="'+(face*2.6)+'" cy="2.6" r="10.4" fill="'+CH.skin+'"/>';
  s += '<circle cx="'+(pf?pf*7.5:0)+'" cy="'+(pf?-9.5:-12.5)+'" r="3" fill="'+CH.gold+'"/>';
  if(face===0){
    s += eyeSVG(-4.4,1.5)+eyeSVG(4.4,1.5)

  }
  return s+'</g>';
}
function poseSVG(p){
  const [nx,ny] = pt(p.px,p.py,p.t,SK.torso);
  const u = [Math.cos(p.t*DD), Math.sin(p.t*DD)], v = [-u[1], u[0]];
  const wx = p.px+u[0]*7, wy = p.py+u[1]*7;
  const so = p.flat ? 7.5 : 2; // arms attach at the shoulders, not the sternum
  const s1x = nx+v[0]*so, s1y = ny+v[1]*so, s2x = nx-v[0]*so, s2y = ny-v[1]*so;
  let torso;
  if(p.bow){ // bendable spine: cat hump / hollow back
    const mx = (wx+nx)/2 + p.bow*Math.cos((p.t+90)*DD);
    const my = (wy+ny)/2 + p.bow*Math.sin((p.t+90)*DD);
    const dp = 'M'+wx.toFixed(1)+','+wy.toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)
      +' '+nx.toFixed(1)+','+ny.toFixed(1);
    torso = '<path d="'+dp+'" stroke="'+CH.line+'" stroke-width="15.6" fill="none" stroke-linecap="round"/>'
      +'<path d="'+dp+'" stroke="'+CH.top+'" stroke-width="13" fill="none" stroke-linecap="round"/>';
  } else {
    torso = cap(wx,wy,nx,ny,13,CH.top);
  }
  torso += cap(wx-u[0]*2+v[0]*6,wy-u[1]*2+v[1]*6, wx-u[0]*2-v[0]*6,wy-u[1]*2-v[1]*6, 2.5, CH.gold);
  const head = charHead(nx,ny,p);
  let s = '<ellipse cx="'+p.px.toFixed(1)+'" cy="139" rx="26" ry="4" fill="#E5DFCF"/>';
  s += charLeg(p.px,p.py,p.l2,p.k2,p.fs2,1,p.f2) + charArm(s2x,s2y,p.a2,p.b2,1);
  s += torso;
  if(p.headBack>=0.5) s += head; // head behind near limbs (e.g. hanging between arms)
  s += charLeg(p.px,p.py,p.l1,p.k1,p.fs1,0,p.f1);
  s += charSkirt(p);
  s += charArm(s1x,s1y,p.a1,p.b1,0);
  if(!(p.headBack>=0.5)) s += head;
  return s;
}
function KFS(list){
  return list.map(p=>Object.assign({bow:0,hd:0,b1:0,b2:0,k1:0,k2:0,fs1:1,fs2:1,flat:0,f1:null,f2:null,headBack:0}, p));
}
const easeIO = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const PKEYS = ["px","py","t","bow","hd","a1","b1","a2","b2","l1","k1","l2","k2","fs1","fs2","flat","f1","f2","headBack"];
function poseTween(d, u){
  const kf = d.kf;
  if(kf.length===1) return kf[0];
  const times = d.times || kf.map((_,i)=>i/(kf.length-1));
  let i=0; while(i<kf.length-2 && u>times[i+1]) i++;
  const t0=times[i], t1=times[i+1];
  const wr = Math.min(1,Math.max(0,(u-t0)/(t1-t0)));
  const w = d.lin ? wr : easeIO(wr); // mocap data plays linearly, hand-made poses eased
  const A=kf[i], B=kf[i+1], p={};
  for(const key of PKEYS){
    p[key] = (A[key]==null || B[key]==null) ? A[key] : A[key]+(B[key]-A[key])*w;
  }
  return p;
}

/* ============ Logik ============ */
/* Training level scaling: plain hold timers grow +15% per level (track timers
   progress through their own step system instead). Capped at 40s — these are
   mostly stretching holds, and longer holds stop helping a child. */
function tlSec(sec){ return Math.min(40, Math.round(sec * (1 + 0.15*(store.tl-1)) / 5) * 5 || sec); }
function resolveItem(it){
  if(!it.track){
    const r = Object.assign({isTrack:false}, it);
    if(r.sec) r.sec = tlSec(r.sec);
    return r;
  }
  const tr = TRACKS[it.track];
  const p = store.progress[it.track];
  const lvl = Math.min(p.lvl, tr.levels.length-1);
  const d = tr.levels[lvl];
  return {name:d.name||tr.label, note:d.note, sec:d.sec, sides:tr.sides,
    isTrack:true, trackKey:it.track, lvl, maxLvl:tr.levels.length-1};
}
function ikey(d,s,i){ return d+"-"+s+"-"+i; }
function dayItems(sec){ return sec.items.filter(it => !(it.minTL > store.tl)); }
function dayKeys(day){
  const out=[]; day.sections.forEach((sec,s)=>dayItems(sec).forEach((_,i)=>out.push(ikey(day.id,s,i))));
  return out;
}

function toggleItem(k){
  if(timer && timer.key===k) stopTimer();
  checked[k] = !checked[k];
  if(checked[k]){ initAudio(); beep(1050, .07); buzz(35); }   // small tick of confirmation
  saveSession();
  render();
}

/* Hands-free timer. You cannot tap a phone while holding a split, so the timer
   counts you in, announces the side change and finishes on its own. Beeps are
   generated, not loaded, so they also work offline. */
const T_READY = 5, T_SWITCH = 10;
let actx = null;
function initAudio(){                      // must run inside a tap to unlock iOS audio
  try {
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  } catch(e) {}
}
function beep(freq, dur, delay){
  if(!actx) return;
  try {
    const t = actx.currentTime + (delay||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch(e) {}
}
function buzz(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch(e) {} }
const SOUND = {
  tick:  ()=>  beep(880, .06),
  go:    ()=>{ beep(1050, .18); buzz(120); },
  swap:  ()=>{ beep(560, .3); beep(760, .3, .34); buzz([160,90,160]); },
  done:  ()=>{ beep(880, .14); beep(1170, .14, .15); beep(1400, .34, .3); buzz([200,100,300]); }
};

let wakeLock = null;
async function keepAwake(on){              // stop the screen locking mid-hold
  try {
    if(on && !wakeLock && navigator.wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e) {}
}

function phaseEnd(sec){ return Date.now() + sec*1000; }
function startTimer(k, sec, ev, sides){
  if(ev) ev.stopPropagation();
  clearInterval(timerInt);
  initAudio(); keepAwake(true);
  timer = {key:k, total:sec, sides:!!sides, side:1, phase:"ready",
           endsAt: phaseEnd(T_READY), left:T_READY, lastTick:null};
  runTimer();
  render();
}
/* Driven by wall-clock rather than by counting ticks: browsers throttle timers
   in the background, and a stretch hold has to stay honest. */
function runTimer(){
  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    if(!timer) return;
    const left = Math.max(0, Math.ceil((timer.endsAt - Date.now())/1000));
    if(left !== timer.left){
      timer.left = left;
      if(left > 0 && left <= 3 && timer.lastTick !== left){ timer.lastTick = left; SOUND.tick(); }
      if(left === 0) nextPhase();
      renderTimer();
    }
  }, 200);
}
function nextPhase(){
  timer.lastTick = null;
  if(timer.phase === "ready" || timer.phase === "switch"){
    timer.phase = "run"; timer.endsAt = phaseEnd(timer.total); timer.left = timer.total;
    SOUND.go();
  } else if(timer.sides && timer.side === 1){
    timer.phase = "switch"; timer.side = 2;
    timer.endsAt = phaseEnd(T_SWITCH); timer.left = T_SWITCH;
    SOUND.swap();
  } else {
    timer.phase = "done";
    clearInterval(timerInt); keepAwake(false);
    checked[timer.key] = true; saveSession();
    SOUND.done();
  }
}
function stopTimer(ev){ if(ev) ev.stopPropagation(); clearInterval(timerInt); keepAwake(false); timer=null; render(); }
/* Tapping the timer pauses instead of closing: mid-hold you brush the screen
   easily, and losing the run for that would be worse than a stray pause. */
function pauseTimer(){
  if(!timer) return;
  if(timer.phase === "done"){ stopTimer(); return; }
  if(timer.paused){
    timer.endsAt = Date.now() + timer.remain*1000;
    timer.paused = false;
    timer.lastTick = null;
    runTimer();
  } else {
    timer.remain = Math.max(0, (timer.endsAt - Date.now())/1000);
    timer.paused = true;
    clearInterval(timerInt);
  }
  renderTimer();
}
function restartTimer(ev){ ev.stopPropagation(); if(timer) startTimer(timer.key, timer.total, null, timer.sides); }
function addTime(ev){                      // more time to get into position
  ev.stopPropagation();
  if(!timer || timer.phase === "done") return;
  timer.endsAt += 10000; timer.lastTick = null; renderTimer();
}

/* ============ Generated sessions ============ */
/* Not a random pick: a session always runs warm-up → main part → cool-down,
   and jumps never sit behind long static stretches. Only the selection inside
   each block varies, so every session is different but still a sound session. */
const FOCUS = [
  {id:"mix",     name:"Bunt gemischt",      emoji:"🎲", main:["skill","strength"]},
  {id:"kraft",   name:"Kraft",              emoji:"💪", main:["strength"]},
  {id:"beweg",   name:"Beweglichkeit",      emoji:"🤸", main:["stretch"], extraStretch:true},
  {id:"bruecke", name:"Brücke & Bogengang", emoji:"🌈", main:["skill"], match:/[Bb]rücke|Bogengang|Kick-over|Wand runter|Bein in der/},
  {id:"rad",     name:"Rad & Radwende",     emoji:"⭐", main:["skill"], match:/Rad|Radwende|Radschlag|Handstand/},
  {id:"sprung",  name:"Sprünge",            emoji:"🦘", main:["skill","finish"], match:/[Ss]prung|Toe|Hurdler|Star|Pike|Tuck|Strecksprung/}
];
const STRETCH_GOALS = [
  {id:"all",     name:"Alles ein bisschen", emoji:"🌍", match:null},
  {id:"spagat",  name:"Spagat",             emoji:"🦵", match:/Spagat|Ausfallschritt|Schmetterling|Beinrückseite/},
  {id:"bruecke", name:"Brücke",             emoji:"🌈", match:/Brücke|Kobra|Schulter/},
  {id:"schulter",name:"Schultern & Handgelenke", emoji:"🙌", match:/Schulter|Handgelenk/}
];

function poolOf(kind){
  const out = [];
  DAYS.forEach(d => (d.sections||[]).forEach(sec => {
    if((sec.kind||"skill") !== kind) return;
    dayItems(sec).forEach(it => out.push(it));
  }));
  const seen = new Set();          // same exercise on several days, and "5x Rad" vs "3x Rad"
  return out.filter(it => {
    const id = it.track || (it.name||"").replace(/^\d+x?\s*/, "").toLowerCase();
    if(seen.has(id)) return false;
    seen.add(id); return true;
  });
}
function itemLabel(it){ return it.name || (TRACKS[it.track] && TRACKS[it.track].label) || ""; }
function pickSome(list, n, match){
  if(!match) return shuffle(list).slice(0, n);
  const hit  = shuffle(list.filter(it =>  match.test(itemLabel(it))));
  const rest = shuffle(list.filter(it => !match.test(itemLabel(it))));
  /* Keep the chosen focus dominant: rather run a shorter block than pad it
     with work that has nothing to do with what the child picked. */
  const fill = Math.max(0, Math.min(n - hit.length, Math.ceil(n/3)));
  return hit.slice(0, n).concat(rest.slice(0, fill));
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildSession(focusId){
  const f = FOCUS.find(x=>x.id===focusId) || FOCUS[0];
  const sections = [{title:"Aufwärmen", kind:"warm", items:pickSome(poolOf("warm"), 4)}];
  const mainItems = [];
  f.main.forEach(kind => mainItems.push(...pickSome(poolOf(kind), f.main.length>1?3:5, f.match)));
  sections.push({title:"Hauptteil: "+f.name, kind:"skill", items:mainItems});
  if(!f.main.includes("finish")) sections.push({title:"Abschluss", kind:"finish", items:pickSome(poolOf("finish"), 2)});
  sections.push({title:"Dehnen zum Schluss", kind:"stretch",
    items:pickSome(poolOf("stretch"), f.extraStretch?5:3, f.match)});
  genPlan = {id:"G", name:"Extra-Training: "+f.name, emoji:f.emoji, color:C.gold,
             tint:"#FFFFFF", sections, generated:true};
  checked = {}; dayId = "G"; tab = "training"; saveSession(); render();
}
function buildStretch(goalId){
  const g = STRETCH_GOALS.find(x=>x.id===goalId) || STRETCH_GOALS[0];
  const items = pickSome(poolOf("stretch"), 5, g.match)
    .concat(pickSome(poolOf("warm"), 2));            // gentle mobility to finish
  genPlan = {id:"G", name:"Dehnen: "+g.name, emoji:g.emoji, color:C.gold, tint:"#FFFFFF",
             sections:[{title:"Locker machen", kind:"warm", items:items.slice(5)},
                       {title:"Dehnen – ruhig atmen", kind:"stretch", items:items.slice(0,5)}],
             generated:true};
  checked = {}; dayId = "G"; tab = "training"; saveSession(); render();
}
function findDay(id){ return id==="G" ? genPlan : DAYS.find(d=>d.id===id); }

/* Steps get progressively harder to reach: early wins come fast, the last
   steps take real training time (stepAfter + current level trainings). */
function stepNeed(tr, p){ return tr.stepAfter + p.lvl; }
function finishTraining(){
  const day = findDay(dayId);
  if(!day) return;
  const tracksInDay = new Set();
  day.sections.forEach((sec,s)=>dayItems(sec).forEach((it,i)=>{
    if(it.track && checked[ikey(day.id,s,i)]) tracksInDay.add(it.track);
  }));
  const ups=[], gated=[];
  tracksInDay.forEach(t=>{
    const tr=TRACKS[t], p=store.progress[t];
    if(p.lvl >= tr.levels.length-1) return;
    p.cnt++;
    if(p.cnt >= stepNeed(tr, p)){
      const nx = tr.levels[p.lvl+1];
      if(nx.gate && !store.milestones.includes(nx.gate)){ gated.push(tr.label); }
      else {
        p.lvl++; p.cnt=0; ups.push(nx.name || (tr.label+" – Stufe "+(p.lvl+1)));
        /* Mirror track progress into the matching skill line: reaching step N
           means the home steps before it are mastered. */
        if(tr.line){
          const ln = LINES.find(l=>l.id===tr.line);
          if(ln) ln.steps.slice(0, p.lvl).forEach(s=>{ if(s.cat==="heim") store.linesDone[s.id]=true; });
        }
      }
    }
  });
  store.log.push({d: day.generated ? "G" : day.id, t: Date.now()});
  setTimeout(syncNow, 0);              // let the coach see it, if connected
  if(store.log.length > 300) store.log = store.log.slice(-300);
  let tlUp = false;
  /* Extra sessions build the exercise steps but do not raise the training
     level: that stays tied to doing all three days, so the balance between
     flexibility, strength and technique cannot be skipped. */
  if(day.generated){
    store.extra = (store.extra||0) + 1;
  } else {
    store.unit[day.id] = (store.unit[day.id]||0) + 1;
    if(store.tl < TL_MAX && ["A","B","C"].every(d=>store.unit[d]>=TL_NEED)){
      store.tl++;
      store.unit = {A:0, B:0, C:0};
      tlUp = true;
    }
  }
  saveStore();
  celebrate = {ups, gated, tlUp};
  checked = {};
  saveSession();
  stopTimer();
}

function toggleMs(id){

function adjustLvl(t, delta){
  const tr=TRACKS[t], p=store.progress[t];
  p.lvl = Math.max(0, Math.min(tr.levels.length-1, p.lvl+delta));
  p.cnt = 0;
  saveStore(); render();
}

function toggleSkill(id){

  }
  saveStore(); render();

function levelDone(lv){ return lv.skills.every(s=>store.levels[s.id]); }
/* Highest fully completed tumbling level, e.g. "Level 1"; null if none */
function currentRank(){
  let rank = null;
  for(const lv of LEVELS){
    if(lv.id==="J") continue;
    if(levelDone(lv)) rank = lv; else break;
  }
  return rank;
}
function findSkill(id){
  for(const lv of LEVELS) for(const s of lv.skills) if(s.id===id) return s;
  return null;
}
function showSkill(id, ev){
  if(ev) ev.stopPropagation();
  demoSkill = findSkill(id);
  demoShown = demoSkill ? demoSkill.demo : null;
  render();

/* Training history. Counted per week rather than per day, because the plan is
   two sessions a week - a daily streak would punish following it correctly. */
const WEEK = 7*86400000;
function weekKey(ts){
  const d = new Date(ts);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));       // Thursday decides the week
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return d.getFullYear()+"-"+Math.ceil((((d - jan1)/86400000)+1)/7);
}
function historyStats(){
  const weeks = {};
  (store.log||[]).forEach(e => { const k = weekKey(e.t); weeks[k] = (weeks[k]||0)+1; });
  const now = Date.now();
  const thisWeek = weeks[weekKey(now)] || 0;
  let streak = 0, i = thisWeek ? 0 : 1;                 // the running week may still be empty
  for(; i <= 60; i++){
    if(!weeks[weekKey(now - i*WEEK)]) break;
    streak++;
  }
  const bars = [];
  for(let w = 5; w >= 0; w--) bars.push(weeks[weekKey(now - w*WEEK)] || 0);
  return {thisWeek, streak, bars, total:(store.log||[]).length};
}
function historyHTML(){
  const s = historyStats();
  if(!s.total) return '';
  const max = Math.max(2, ...s.bars);
  const bars = s.bars.map((n,i)=>
    '<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;'
    + 'align-items:center;gap:4px">'
    + '<div style="width:100%;height:'+Math.max(3, n/max*40)+'px;border-radius:5px;background:'
    + (n ? 'var(--gold)' : 'var(--line)')+'"></div>'
    + '<span style="font-size:10px;color:var(--sub);line-height:1">'+(i===5?'jetzt':(n||'·'))+'</span></div>').join('');
  return '<div class="card" style="padding:13px 14px 10px;margin-bottom:12px">'
    + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:9px">'
    + '<span style="font-weight:900;font-size:15px">'
    + (s.streak > 1 ? '🔥 '+s.streak+' Wochen in Folge' : '🔥 Dabei!')+'</span>'
    + '<span style="font-size:12.5px;color:var(--sub);margin-left:auto">'
    + (s.thisWeek ? 'diese Woche '+s.thisWeek+'×' : 'diese Woche noch nichts')+'</span></div>'
    + '<div style="display:flex;gap:5px;height:58px">'+bars+'</div>'
    + '<div style="font-size:11.5px;color:var(--sub);text-align:center;margin-top:4px">'
    + 'letzte 6 Wochen · insgesamt '+s.total+' Trainings</div></div>';
}

    +'<div style="font-size:13px;color:var(--sub)">'

            : 'Sammle je '+TL_NEED+' Einheiten pro Trainingstag für Level '+(store.tl+1)+'!')

    +(profiles.length>1 ? '👥 Turner wechseln' : '👥 Noch ein Kind übt mit')+'</button></div>';

      : '<button class="reset" onclick="confirmReset=true;render()">Alles zurücksetzen</button>')

/* Progress backup: localStorage does not survive a cleared browser cache,
   so parents can save/restore the whole store as a JSON file. */
/* Backups cover every profile on the device, so one file restores the whole
   family. Files written before profiles existed hold a single store. */
function exportData(){
  const blob = new Blob([JSON.stringify({profiles, active:activeId}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tumbling-star-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    f.text().then(txt => {
      const data = JSON.parse(txt);
      if(data && Array.isArray(data.profiles) && data.profiles.length){
        profiles = data.profiles.map(p => ({id:p.id||newId(), name:p.name||"Turner",
          emoji:p.emoji||"⭐", data:normalize(p.data)}));
        activeId = profiles.some(p=>p.id===data.active) ? data.active : profiles[0].id;
      } else if(data && Array.isArray(data.stars)){
        activeProfile().data = normalize(data);   // pre-profile backup
      } else throw new Error("bad");
      store = activeProfile().data;
      loadSession();
      saveProfiles(); render();
    }).catch(() => alert("Diese Datei ist kein Tumbling-Star-Backup."));
  };
  inp.click();
}

function renderTimer(){
  const el = document.getElementById("timerOverlay");
  if(!el || !timer) return;
  const p = timer.phase;
  const span = p==="ready" ? T_READY : p==="switch" ? T_SWITCH : timer.total;
  const deg = p==="done" ? 360 : (1 - timer.left/span) * 360;
  const sideNote = timer.sides ? ' · '+timer.side+'. Seite' : '';
  const face = {
    ready:  {num:timer.left, sub:"Fertig machen…", msg:"Geh in die Position", ring:"#8A8194"},
    run:    {num:timer.left, sub:"Sekunden"+sideNote, msg:"Halten … du schaffst das!", ring:"var(--gold)"},
    switch: {num:timer.left, sub:"Seite wechseln", msg:"Jetzt die andere Seite!", ring:"#E7C463"},
    done:   {num:"⭐",       sub:"Geschafft!",      msg:"Tippen zum Schließen", ring:"var(--gold)"}
  }[p];
  const btn = (label, fn) => '<button onclick="'+fn+'(event)" style="margin-top:14px;border:none;'
    +'border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;'
    +'background:var(--gold);color:var(--ink)">'+label+'</button>';
  if(timer.paused){ face.num = "⏸"; face.sub = face.sub; face.msg = "Pause – tippen und weiter geht's"; }
  el.innerHTML =
    '<button onclick="stopTimer(event)" style="position:absolute;top:calc(14px + env(safe-area-inset-top));'
    +'right:16px;border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;'
    +'width:38px;height:38px;font-size:17px;font-weight:800">✕</button>'
    +'<div class="ring" style="background:conic-gradient('+face.ring+' '+deg+'deg, #3E3947 0deg)">'
    +'<div class="ringin"><div class="tnum">'+face.num+'</div>'
    +'<div style="font-size:14px;opacity:.8">'+face.sub+'</div></div></div>'
    +'<div style="color:#fff;margin-top:18px;font-size:15px;font-weight:700">'+face.msg+'</div>'
    + (p==="done" ? btn('🔁 Nochmal', 'restartTimer')
      : timer.paused ? '' : btn('+10 Sek.', 'addTime'));
}

    + '<div style="font-size:11.5px;color:var(--sub);text-align:center;margin-top:10px">'
    + 'Bleibt auf deinem Gerät – wir speichern nichts im Internet.</div>'
    + '</div></div>';
}

function render(){
  const app = document.getElementById("app");
  if(!activeProfile().name){ app.innerHTML = welcomeHTML(); return; }
  const me = activeProfile();
  /* One child on their own phone never needs a profile switcher, so it only
     shows up once a second profile exists (shared tablet, siblings). */
  let h = '<div class="toprow">'
    + (profiles.length > 1
      ? '<button class="who" onclick="toggleProfileMenu()">'
        + '<span style="font-size:19px">'+me.emoji+'</span>'
        + '<span>'+esc(me.name)+'</span><span style="color:var(--sub)">▾</span></button>'
      : '<span></span>')
    + '<button class="who" onclick="showHelp(tab)" aria-label="Hilfe">? Hilfe</button></div>';
  h += '<h1>⭐ Tumbling-Star</h1><p class="sub">Dein Weg zum Bogengang – Stufe für Stufe</p>';
  h += '<div class="tabs">'
    +'<button class="tab'+(tab==="training"?' on':'')+'" onclick="setTab(\'training\')">🏋️ Training</button>'
    +'<button class="tab'+(tab==="tracker"?' on':'')+'" onclick="setTab(\'tracker\')">⭐ Sterne</button>'
    +'<button class="tab'+(tab==="level"?' on':'')+'" onclick="setTab(\'level\')">🤸 Level</button>'
    +'<button class="tab'+(tab==="ziele"?' on':'')+'" onclick="setTab(\'ziele\')">🏆 Ziele</button></div>';
  if(tab==="training") h += trainingHTML();
  else if(tab==="tracker") h += trackerHTML();
  else if(tab==="level") h += levelHTML();
  else h += zieleHTML();
  h += overlaysHTML();
  app.innerHTML = h;
  renderTimer();
  startDemoAnim();
}
render();

/* Web only. Inside the native app every file is already on the device, so the
   worker adds nothing but a cache layer that serves yesterday's build. */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform
                  && window.Capacitor.isNativePlatform());
if (!NATIVE && "serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js");
} else if (NATIVE && "serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => rs.forEach(r => r.unregister()))     // clean up after an update
    .catch(()=>{});
}
</script>
</body>
</html>
