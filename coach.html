<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumbling-Star · Trainer</title>
<meta name="theme-color" content="#FAF8F3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');
:root{
  --bg:#FAF8F3; --ink:#191621; --sub:#8A8194;
  --gold:#C9A227; --goldSoft:#E7C463; --goldPale:#FFF6DB; --warn:#E2654F;
  --card:#FFFFFF; --line:#E8E2D2; --shadow:#E8E2D2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:'Baloo 2', ui-rounded, system-ui, sans-serif}
#app{max-width:760px; margin:0 auto; padding:16px 14px 50px;
  padding-top:calc(16px + env(safe-area-inset-top))}
h1{font-size:25px; margin:2px 0 0; text-align:center}
.sub{text-align:center; color:var(--sub); margin:2px 0 16px; font-size:13.5px}
button{font-family:inherit; cursor:pointer}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:18px;
  padding:14px 15px; box-shadow:0 3px 0 var(--shadow); margin-bottom:12px}
.btn{width:100%; padding:13px; border-radius:14px; border:none; font-size:16px;
  font-weight:800; color:var(--goldSoft); background:var(--ink);
  box-shadow:0 4px 0 var(--gold); margin-top:10px}
.mini{border:none; background:#EFECE4; border-radius:999px; padding:6px 12px;
  font-size:12.5px; font-weight:800; color:var(--ink)}
input{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
  font-family:inherit; font-size:16px; font-weight:700; background:var(--bg); color:var(--ink)}
.lbl{font-size:14px; font-weight:800; margin:16px 2px 8px; color:var(--sub)}
.row{display:flex; align-items:center; gap:10px}
.name{font-weight:900; font-size:17px}
.badge{font-size:11px; font-weight:900; border-radius:999px; padding:3px 9px;
  background:var(--gold); color:var(--ink)}
.quiet{background:#F2EEE3; color:var(--sub)}
.warnb{background:var(--warn); color:#fff}
.meta{font-size:12.5px; color:var(--sub)}
.bar{height:9px; background:#F2EEE3; border-radius:999px; overflow:hidden; flex:1}
.fill{height:100%; background:var(--gold); border-radius:999px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:7px; margin-top:10px}
.chip{background:var(--bg); border:1.5px solid var(--line); border-radius:11px; padding:7px 9px;
  font-size:12.5px; display:flex; align-items:center; gap:7px}
.chip b{font-weight:800}
.hint{background:var(--goldPale); border:2px solid var(--gold); border-radius:14px;
  padding:11px 13px; font-size:13px; line-height:1.5; color:#5A4A16}
.code{font-size:34px; font-weight:800; letter-spacing:5px; text-align:center;
  background:var(--bg); border-radius:14px; padding:12px; margin:8px 0}
</style>
</head>
<body>
<div id="app">Lade…</div>
<script>
const TKEY = "tumbling-star-coach";
/* ?demo=1 shows the whole view filled with made-up athletes, so it can be
   handed to a coach for feedback without a running sync server. */
const DEMO = new URLSearchParams(location.search).has("demo");
let coach = null;          // {token, name}
try { coach = JSON.parse(localStorage.getItem(TKEY) || "null"); } catch(e) {}
let athletes = [], D = null, busy = false, msg = "";
let planFor = null, planPick = {};      // athlete id whose homework is being put together

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const api = (path, body) => fetch(path, {method:"POST",
  headers:{"content-type":"application/json"}, body:JSON.stringify(body||{})})
  .then(r => r.json().then(j => r.ok ? j : Promise.reject(new Error(j.error||"Fehler"))));

/* The exercise definitions live in the app; pulling them from there keeps one
   source of truth instead of a second copy that silently drifts. */
fetch("index.html").then(r=>r.text()).then(src=>{
  const data = src.split("/* ============ Daten ============ */")[1]
                  .split("/* ============ Profiles ============ */")[0];
  D = new Function(data + "; return {TRACKS, TRACK_KEYS, LINES, TL_FOCUS, LEVELS, MILESTONES};")();
  if(DEMO){ coach = {token:"demo", name:"Demo"}; athletes = demoAthletes(); render(); }
  else if(coach) load(); else render();
}).catch(()=>{ msg = "Konnte die Übungsdaten nicht laden."; render(); });

/* Built from the real definitions rather than hard-coded copies, so the demo
   cannot drift away from the app. Three states a coach should judge: someone
   active, a beginner, and someone who stopped training. */
function demoAthletes(){
  const day = 86400000, now = Date.now();
  const doneSteps = counts => {
    const done = {};
    (D.LINES||[]).forEach((ln, i) => ln.steps.slice(0, counts[i]||0)
      .forEach(st => done[st.id] = true));
    return done;
  };
  const levels = offset => {
    const p = {};
    (D.TRACK_KEYS||[]).forEach((k, i) => {
      const max = D.TRACKS[k].levels.length - 1;
      p[k] = {lvl: Math.min(max, Math.max(0, offset + (i % 3) - 1))};
    });
    return p;
  };
  const sessions = (n, every) => Array.from({length:n}, (_, i) => ({t: now - i*every}));
  const plan = (byName, note, items, at) => ({by:byName, at, note, items});
  return [
    {id:"d1", name:"Mia", updated: now - day, videos:[{step:"bg5", created: now - day, ticket:"demo"}], data:{
      tl:2, progress:levels(2), linesDone:doneSteps([4,2,0,0,1]), log:sessions(2, 3*day),
      assignDone:{"tr:bruecke":true},
      assignAt: now - 2*day}, assignment: plan("Du", "Diese Woche jeden Tag kurz die Brücke!",
        [{key:"tr:bruecke", label:"Brücke halten – 20 Sek."},
         {key:"ln:bg2", label:"Kick-over von der Erhöhung"}], now - 2*day)},
    {id:"d2", name:"Lena", updated: now, data:{
      tl:1, progress:levels(0), linesDone:doneSteps([1,0,0,0,0]), log:sessions(1, day)}},
    {id:"d3", name:"Jonas", updated: now - 22*day, data:{
      tl:3, progress:levels(3), linesDone:doneSteps([5,3,1,0,2]), log:[]}}
  ];
}

function load(){
  if(DEMO){ athletes = demoAthletes(); busy = false; render(); return; }
  busy = true; render();
  api("/api/coach/athletes", {token:coach.token})
    .then(r => { coach.name = r.coach; athletes = r.athletes; msg = ""; })
    .catch(e => { msg = e.message; if(/Trainer-Zugang/.test(e.message)) logout(true); })
    .finally(()=>{ busy = false; render(); });
}
function logout(silent){
  localStorage.removeItem(TKEY); coach = null; athletes = [];
  if(!silent) render();
}
function signUp(){
  const name = (document.getElementById("cname").value||"").trim();
  if(!name) return;
  api("/api/coach", {name}).then(r=>{
    coach = {token:r.token, name:r.name};
    localStorage.setItem(TKEY, JSON.stringify(coach));
    load();
  }).catch(e=>{ msg = e.message; render(); });
}
function claim(){
  if(DEMO){ msg = "In der Demo-Ansicht lassen sich keine echten Kinder verbinden."; render(); return; }
  const el = document.getElementById("pcode");
  const code = (el.value||"").replace(/\D/g,"");
  if(code.length !== 6){ msg = "Der Code hat 6 Ziffern."; render(); return; }
  api("/api/pair/claim", {token:coach.token, code}).then(r=>{
    msg = r.athlete.name+" ist jetzt in deiner Gruppe.";
    el.value = ""; load();
  }).catch(e=>{ msg = e.message; render(); });
}
/* The decision is the point of the whole view: approve and the step is ticked
   off in the child's app, reject and it goes back to practice. Either way the
   clip is deleted server-side. */
function decide(athlete, step, ok, name){
  if(DEMO){ msg = "In der Beispiel-Ansicht wird nichts wirklich freigegeben."; render(); return; }
  const note = prompt(ok ? "Kurzes Lob (optional):" : "Was soll sie/er noch üben? (optional)", "");
  if(note === null) return;
  api("/api/coach/decide", {token:coach.token, athlete, step, ok, note})
    .then(()=>{ msg = name+": "+(ok ? "freigegeben." : "zurück zum Üben."); load(); })
    .catch(e=>{ msg = e.message; render(); });
}

function remove(id, name){
  if(!confirm(name+" aus deiner Gruppe entfernen?")) return;
  if(DEMO){ athletes = athletes.filter(a => a.id !== id); render(); return; }
  api("/api/coach/remove", {token:coach.token, athlete:id}).then(load);
}

function ago(ts){
  if(!ts) return "noch nie";
  const d = Math.floor((Date.now()-ts)/86400000);
  if(d <= 0) return "heute";
  if(d === 1) return "gestern";
  if(d < 7) return "vor "+d+" Tagen";
  const w = Math.floor(d/7);
  return "vor "+w+" Woche"+(w===1?"":"n");
}
function weekCount(log){
  const wk = Date.now() - 7*86400000;
  return (log||[]).filter(e => e.t > wk).length;
}

function athleteCard(a){
  const s = a.data || {};
  const tl = s.tl || 1;
  const week = weekCount(s.log);
  const stale = !a.updated || Date.now()-a.updated > 14*86400000;
  /* Skill lines a coach actually cares about: what is this child working on
     right now, and which steps wait for a trainer's confirmation. */
  const lines = (D.LINES||[]).map(ln=>{
    const done = ln.steps.filter(st => (s.linesDone||{})[st.id]).length;
    const cur = ln.steps.find(st => !(s.linesDone||{})[st.id]);
    return {name:ln.name, done, total:ln.steps.length, cur, waiting: cur && cur.cat === "verein"};
  });
  /* Anything the coach has to rule on: a clip that was sent, plus club steps the
     child has reached. Hanging this on the videos matters — a child may send a
     clip for a step that is not the current one, and it must not vanish. */
  const waiting = lines.filter(l => l.waiting);
  const judge = [], seen = {};
  (a.videos||[]).forEach(v => {
    const st = stepById(v.step);
    if(st && !seen[st.id]){ seen[st.id] = true; judge.push(st); }
  });
  waiting.forEach(l => { if(!seen[l.cur.id]){ seen[l.cur.id] = true; judge.push(l.cur); } });
  const steps = (D.TRACK_KEYS||[]).map(k=>{
    const tr = D.TRACKS[k], p = (s.progress||{})[k] || {lvl:0};
    const def = tr.levels[Math.min(p.lvl, tr.levels.length-1)];
    return '<div class="chip"><b>'+esc(tr.label)+'</b><span class="meta" style="margin-left:auto">'
      + (def.sec ? def.sec+" Sek." : esc(def.note||def.name||"")) + ' · '+(p.lvl+1)+'/'+tr.levels.length+'</span></div>';
  }).join("");

  return '<div class="card"><div class="row">'
    + '<span class="name">'+esc(a.name)+'</span>'
    + '<span class="badge">Level '+tl+'</span>'
    + (stale ? '<span class="badge warnb">'+ago(a.updated)+' nichts gemacht</span>'
             : '<span class="badge quiet">'+week+'× diese Woche</span>')
    + '<button class="mini" style="margin-left:auto" onclick="remove(\''+a.id+'\',\''+esc(a.name)+'\')">entfernen</button>'
    + '</div>'
    + '<div class="meta" style="margin-top:6px">Zuletzt geturnt: '+ago(a.updated)
    + ' · Schwerpunkt: '+esc((D.TL_FOCUS||{})[tl]||"–")+'</div>'
    + (judge.length
      ? '<div class="hint" style="margin-top:10px"><b>Wartet auf dein Okay:</b> '
        + judge.map(st=>esc(st.name)).join(", ")+'</div>' : '')
    + judge.map(st => judgeHTML(a, st)).join("")
    + '<div class="lbl" style="margin:12px 2px 6px">Skill-Linien</div>'
    + lines.map(l =>
        '<div class="row" style="margin-bottom:6px"><span style="font-size:12.5px;min-width:120px">'
        + esc(l.name)+'</span><div class="bar"><div class="fill" style="width:'
        + (l.done/l.total*100)+'%"></div></div><span class="meta">'+l.done+'/'+l.total+'</span></div>').join("")
    + '<div class="lbl" style="margin:12px 2px 6px">Übungsstufen</div>'
    + '<div class="grid">'+steps+'</div>'
    + planHTML(a) + '</div>';
}

/* Shown per step a child is waiting on: their clip if they sent one, and the
   two buttons that end the wait. */
/* The catalogue a coach picks from is the app's own: hold exercises at the
   child's current level, plus the next step of every skill line. */
function planCatalog(a){
  const s = a.data || {};
  const out = [];
  (D.TRACK_KEYS||[]).forEach(k=>{
    const tr = D.TRACKS[k], p = (s.progress||{})[k] || {lvl:0};
    const def = tr.levels[Math.min(p.lvl, tr.levels.length-1)];
    out.push({key:"tr:"+k, label: tr.label+" – "+(def.sec ? def.sec+" Sek." : (def.note||def.name||""))});
  });
  (D.LINES||[]).forEach(ln=>{
    const cur = ln.steps.find(st => !(s.linesDone||{})[st.id]);
    if(cur) out.push({key:"ln:"+cur.id, label: cur.name});
  });
  return out;
}
function openPlan(id){
  planFor = planFor === id ? null : id;
  planPick = {};
  const a = athletes.find(x=>x.id===id);
  /* Only the keys are remembered; the wording always comes from the catalogue,
     so a changed plan never carries yesterday's hold time. */
  if(planFor && a && a.assignment) a.assignment.items.forEach(i => planPick[i.key] = true);
  render();
}
function togglePick(key){
  if(planPick[key]) delete planPick[key]; else planPick[key] = true;
  render();
}
function sendPlan(id, name){
  if(DEMO){ msg = "In der Beispiel-Ansicht wird nichts wirklich verschickt."; render(); return; }
  const a = athletes.find(x => x.id === id);
  const items = planCatalog(a).filter(i => planPick[i.key]);
  const note = (document.getElementById("plannote")||{}).value || "";
  api("/api/coach/assign", {token:coach.token, athlete:id, items, note})
    .then(()=>{ msg = items.length ? name+" hat das Training bekommen." : "Training gelöscht.";
                planFor = null; planPick = {}; load(); })
    .catch(e=>{ msg = e.message; render(); });
}

function stepById(id){
  for(const ln of (D.LINES||[])){ const st = ln.steps.find(s => s.id === id); if(st) return st; }
  return null;
}

function judgeHTML(a, step){
  const vid = (a.videos||[]).find(v => v.step === step.id);
  const player = DEMO
    ? '<div style="background:#EFECE4;border-radius:12px;padding:26px 12px;text-align:center;'
      + 'color:var(--sub);font-size:13px">Hier läuft das Video, das '+esc(a.name)+' aufgenommen hat</div>'
    : vid
      ? '<video src="/api/video?t='+encodeURIComponent(vid.ticket)+'" controls playsinline '
        + 'preload="metadata" style="width:100%;max-height:46vh;border-radius:12px;'
        + 'background:#000;object-fit:contain"></video>'
      : '<div class="meta">Kein Video – gib den Schritt frei, wenn du ihn im Training gesehen hast.</div>';
  const btn = (label, ok, bg) => '<button class="mini" style="background:'+bg+';color:#fff;padding:9px 14px" '
    + 'onclick="decide(\''+a.id+'\',\''+step.id+'\','+ok+',\''+esc(a.name)+'\')">'+label+'</button>';
  return '<div style="margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px">'
    + '<div style="font-weight:800;font-size:14px;margin-bottom:8px">'+esc(step.name)+'</div>'
    + player
    + '<div class="row" style="margin-top:9px;gap:8px">'
    + btn('Freigeben', true, '#4C9A5F') + btn('Noch üben', false, 'var(--warn)')
    + '<span class="meta" style="margin-left:auto">'
    + (DEMO ? 'gestern aufgenommen' : vid ? 'geschickt: '+ago(vid.created) : 'im Training gesehen')
    + '</span></div>'
    + '</div>';
}

/* Homework the coach set, and the editor to change it. Deliberately a plain
   list of the child's own exercises: nothing new to learn, and the child sees
   the same wording in their app. */
function planHTML(a){
  const cur = a.assignment;
  const done = (a.data||{}).assignDone || {};
  const open = planFor === a.id;
  let h = '<div class="lbl" style="margin:14px 2px 6px">Training für zuhause</div>';

  if(cur && !open){
    h += '<div style="border:1.5px solid var(--line);border-radius:14px;padding:11px">'
      + (cur.note ? '<div style="font-size:13px;margin-bottom:7px">„'+esc(cur.note)+'“</div>' : '')
      + cur.items.map(i => '<div class="row" style="font-size:13px;margin-bottom:4px">'
          + '<span>'+(done[i.key] ? '✅' : '⬜')+'</span><span>'+esc(i.label)+'</span></div>').join("")
      + '<div class="meta" style="margin-top:7px">gestellt '+ago(cur.at)+' · '
      + cur.items.filter(i=>done[i.key]).length+'/'+cur.items.length+' erledigt</div>'
      + '<button class="mini" style="margin-top:9px" onclick="openPlan(\''+a.id+'\')">ändern</button></div>';
    return h;
  }
  if(!open){
    return h + '<div style="border:1.5px dashed var(--line);border-radius:14px;padding:11px">'
      + '<div class="meta">Noch nichts gestellt.</div>'
      + '<button class="mini" style="margin-top:8px" onclick="openPlan(\''+a.id+'\')">'
      + 'Training zusammenstellen</button></div>';
  }

  const cat = planCatalog(a);
  h += '<div style="border:1.5px solid var(--gold);border-radius:14px;padding:11px">'
    + '<div class="meta" style="margin-bottom:8px">Such aus, was '+esc(a.name)
    + ' zuhause üben soll. Sie sieht es in ihrer App zum Abhaken.</div>'
    + cat.map(i => '<button class="chip" style="width:100%;text-align:left;margin-bottom:5px;'
        + 'border-color:'+(planPick[i.key] ? 'var(--gold)' : 'var(--line)')+'" '
        + 'onclick="togglePick(\''+i.key+'\')">'
        + (planPick[i.key] ? '✅ ' : '⬜ ')+esc(i.label)+'</button>').join("")
    + '<input id="plannote" maxlength="200" placeholder="Ein Satz dazu (optional)" '
    + 'style="margin-top:8px" value="'+esc(cur && cur.note || "")+'">'
    + '<div class="row" style="margin-top:9px;gap:8px">'
    + '<button class="mini" style="background:var(--ink);color:var(--goldSoft);padding:10px 15px" '
    + 'onclick="sendPlan(\''+a.id+'\',\''+esc(a.name)+'\')">'
    + (Object.keys(planPick).length ? 'An '+esc(a.name)+' schicken' : 'Training löschen')+'</button>'
    + '<button class="mini" onclick="openPlan(\''+a.id+'\')">abbrechen</button></div></div>';
  return h;
}

function render(){
  const app = document.getElementById("app");
  let h = '<h1>🏅 Trainer-Ansicht</h1>';

  if(!coach){
    h += '<p class="sub">Sieh, woran deine Athleten zuhause arbeiten.</p>'
      + '<div class="card"><div style="font-weight:900;font-size:17px;margin-bottom:8px">Zugang anlegen</div>'
      + '<div class="meta" style="margin-bottom:10px">Nur dein Name – keine E-Mail, kein Passwort. '
      + 'Der Zugang bleibt auf diesem Gerät gespeichert.</div>'
      + '<input id="cname" maxlength="40" placeholder="Dein Name" onkeydown="if(event.key===\'Enter\')signUp()">'
      + '<button class="btn" onclick="signUp()">Los geht\'s</button></div>';
    if(msg) h += '<div class="hint">'+esc(msg)+'</div>';
    app.innerHTML = h; return;
  }

  h += DEMO
    ? '<p class="sub">Beispiel-Ansicht mit erfundenen Turnern</p>'
      + '<div class="hint" style="margin-bottom:12px">Das hier ist eine Vorschau: '
      + 'Mia, Lena und Jonas gibt es nicht. So sieht die Ansicht aus, wenn Kinder '
      + 'wirklich verbunden sind – jedes Kind erzeugt dafür in seiner App einen '
      + 'sechsstelligen Code und liest ihn dir vor.</div>'
    : '<p class="sub">Hallo '+esc(coach.name)+' · '+athletes.length+' Athlet'
      + (athletes.length===1?'':'en')+'</p>';
  h += '<div class="card"><div class="row">'
    + '<input id="pcode" inputmode="numeric" maxlength="6" placeholder="Code vom Kind (6 Ziffern)" '
    + 'onkeydown="if(event.key===\'Enter\')claim()">'
    + '<button class="mini" style="background:var(--ink);color:var(--goldSoft);padding:11px 16px" '
    + 'onclick="claim()">Hinzufügen</button></div>'
    + '<div class="meta" style="margin-top:7px">Das Kind erzeugt den Code in seiner App unter '
    + '„Mit Trainer verbinden“ und liest ihn dir vor.</div></div>';
  if(msg) h += '<div class="hint" style="margin-bottom:12px">'+esc(msg)+'</div>';

  if(busy) h += '<p class="sub">Lade…</p>';
  else if(!athletes.length) h += '<div class="card"><div class="meta">Noch niemand verbunden. '
    + 'Lass dir im Training den Code deiner Turner geben.</div></div>';
  else {
    const sorted = athletes.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
    h += sorted.map(athleteCard).join("");
  }
  h += '<div style="text-align:center;margin-top:16px">'
    + '<button class="mini" onclick="load()">Aktualisieren</button> '
    + (DEMO ? '' : '<button class="mini" onclick="logout()">Abmelden</button>')+'</div>';
  app.innerHTML = h;
}
</script>
</body>
</html>
