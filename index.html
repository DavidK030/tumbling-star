<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumbling-Star</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tumbling-Star">
<meta name="theme-color" content="#FAF8F3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');
:root{
  --bg:#FAF8F3; --ink:#191621; --sub:#8A8194;
  --gold:#C9A227; --goldSoft:#E7C463; --goldPale:#FFF6DB; --warn:#E2654F;
  --card:#FFFFFF; --line:#E8E2D2; --shadow:#E8E2D2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Baloo 2', ui-rounded, 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
#app{max-width:460px; margin:0 auto; padding:16px 14px 44px;
  padding-top:calc(16px + env(safe-area-inset-top));}
h1{text-align:center; font-size:30px; font-weight:800; margin:4px 0 0}
.sub{text-align:center; color:var(--sub); margin:2px 0 14px; font-size:14px}
button{font-family:inherit; cursor:pointer}
.tabs{display:flex; gap:6px; margin-bottom:14px}
.tab{flex:1; padding:10px 2px; border-radius:14px; border:none; font-size:12.5px;
  font-weight:800; background:#EFECE4; color:var(--ink); box-shadow:0 3px 0 #DDD6C6;
  white-space:nowrap}
.tab.on{background:var(--ink); color:var(--goldSoft); box-shadow:0 3px 0 var(--gold)}
.daycard{width:100%; text-align:left; border:1.5px solid var(--line); border-radius:20px;
  padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:12px}
.daycard .em{font-size:34px}
.daycard .nm{font-size:18px; font-weight:900; display:block}
.daycard .in{font-size:13px; color:var(--sub)}
.daycard .ar{margin-left:auto; font-size:22px}
.sectitle{color:var(--ink); border-radius:12px; padding:8px 12px; font-weight:800;
  font-size:15px; margin:16px 0 8px}
.item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:11px 12px;
  margin-bottom:7px; box-shadow:0 3px 0 var(--shadow)}
.item.done{background:#F1FBF3; box-shadow:0 3px 0 #BFE3C6}
.circle{min-width:26px; height:26px; border-radius:50%; background:#fff; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900}
.item.done .circle{background:#4C9A5F; border-color:#4C9A5F !important}
.iname{font-weight:800; font-size:14.5px; display:block}
.item.done .iname{text-decoration:line-through; opacity:.6}
.inote{font-size:12.5px; color:var(--sub)}
.lvl{font-size:10.5px; font-weight:900; color:var(--ink); border-radius:999px;
  padding:2px 7px; margin-left:6px; vertical-align:middle; display:inline-block}
.timerbtn{margin-left:auto; border:none; border-radius:999px; padding:6px 12px;
  font-weight:800; font-size:13px; color:var(--ink); white-space:nowrap}
.bigbtn{width:100%; padding:14px; border-radius:16px; border:none; font-size:17px;
  font-weight:800; color:var(--goldSoft); margin-top:14px; background:var(--ink);
  box-shadow:0 4px 0 var(--gold)}
.safety{background:var(--goldPale); border:2px solid var(--gold); border-radius:16px;
  padding:12px 14px; font-size:13.5px; line-height:1.5; margin-top:16px; color:#5A4A16}
.back{border:none; background:none; font-weight:800; font-size:14px;
  color:var(--sub); padding:2px 0 8px}
.dayhead{border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:10px;
  border:1.5px solid var(--line)}
.pbar{height:10px; background:#F2EEE3; border-radius:999px; margin-top:6px; overflow:hidden}
.pfill{height:100%; border-radius:999px; transition:width .25s}
.overlay{position:fixed; inset:0; background:rgba(25,22,33,.92); display:flex;
  flex-direction:column; align-items:center; justify-content:center; z-index:50;
  text-align:center; padding:24px}
.ring{width:190px; height:190px; border-radius:50%; display:flex;
  align-items:center; justify-content:center}
.ringin{width:158px; height:158px; border-radius:50%; background:var(--ink);
  color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center}
.tnum{font-size:56px; font-weight:900}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:20px;
  padding:14px 14px 6px; box-shadow:0 4px 0 var(--shadow)}
.wrow{display:flex; align-items:center; margin-bottom:10px}
.wlabel{color:var(--ink); border-radius:10px; padding:7px 10px; font-weight:900;
  font-size:13px; min-width:74px; text-align:center}
.slots{display:flex; gap:8px; margin-left:10px}
.slot{width:52px; height:46px; border-radius:12px; border:2px dashed #DDD6C6;
  background:#F7F4EC; font-size:14px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; line-height:1; color:#C4BBA8}
.slot.full{border-color:transparent; background:var(--goldPale); font-size:22px; color:inherit}
.slot.full small{font-size:10px; font-weight:900; color:var(--sub)}
.goldbox{background:var(--goldPale); border-radius:18px; padding:14px 16px; margin-top:14px;
  box-shadow:0 4px 0 var(--gold); text-align:center}
.track{background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  padding:10px 12px; margin-bottom:7px;
  box-shadow:0 3px 0 var(--shadow); display:flex; align-items:center; gap:10px}
.dots{display:flex; gap:4px; margin-top:5px; align-items:center}
.dot{width:10px; height:10px; border-radius:50%; background:#EDE8DC; display:inline-block}
.dot.on{background:var(--gold)}
.pm{border:none; border-radius:8px; width:30px; height:26px; font-weight:900;
  background:#EFECE4; color:var(--ink)}
.reset{border:none; background:none; color:var(--sub); font-size:12.5px;
  text-decoration:underline}
.reset2{border:none; background:var(--warn); color:#fff; font-weight:800; font-size:13px;
  border-radius:999px; padding:8px 16px}
.demobtn{min-width:30px; height:30px; border-radius:50%; border:none; padding:0;
  background:#EFECE4; font-size:14px; display:flex; align-items:center; justify-content:center}
.democard{background:var(--card); border-radius:22px; padding:18px 18px 14px;
  max-width:320px; width:100%; color:var(--ink); text-align:center}
.demotips{text-align:left; margin:8px 0 0; padding-left:20px; font-size:14px;
  line-height:1.5; font-weight:600}
.demotips li{margin-bottom:4px}
.demo-svg{width:100%; max-width:250px; background:#F7F4EC; border-radius:16px}
.demo-svg .st{stroke:var(--ink); stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.demo-svg .stf{stroke:#C9C2B2; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.demo-svg .hd{fill:var(--ink)}
.demo-svg .gr{stroke:#E8E2D2; stroke-width:5; stroke-linecap:round}
.demo-svg .wl{stroke:#C4BBA8; stroke-width:8; stroke-linecap:round}
.demo-svg .blk{fill:#EAE4D6}
.demo-svg .ac{stroke:var(--gold); stroke-width:4; fill:none; stroke-linecap:round}
.demo-svg .act{fill:var(--gold)}
.lvlcard{background:var(--card); border:1.5px solid var(--line); border-radius:16px;
  margin-bottom:10px; box-shadow:0 3px 0 var(--shadow); overflow:hidden}
.lvlhead{display:flex; align-items:center; gap:10px; width:100%; border:none;
  background:none; padding:12px 14px; text-align:left}
.lvlbadge{color:var(--ink); border-radius:10px; padding:6px 10px; font-weight:900;
  font-size:13px; min-width:64px; text-align:center}
.catb{font-size:10px; font-weight:900; color:#fff; border-radius:999px; padding:2px 7px;
  margin-left:6px; display:inline-block; vertical-align:middle; white-space:nowrap}
.skillrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; padding:9px 14px; border-top:1.5px solid #F2EEE3}
.drillbtn{display:flex; align-items:center; gap:8px; width:100%; border:none;
  background:#F7F4EC; border-radius:12px; padding:9px 10px; margin-top:6px;
  text-align:left; font-weight:700; font-size:13.5px; color:var(--ink)}
.warnbox{background:var(--goldPale); border:2px solid var(--gold); border-radius:12px;
  padding:8px 10px; font-size:12.5px; font-weight:700; margin-top:10px; color:#5A4A16}
#splash{position:fixed; inset:0; background:var(--ink); z-index:99; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:22px;
  transition:opacity .45s; overflow:hidden}
#splash.out{opacity:0; pointer-events:none}
#introTitle{color:var(--goldSoft); font-weight:800; font-size:34px; text-align:center}
#introSvg{width:min(86vw,340px); background:#F7F4EC; border-radius:20px;
  box-shadow:0 5px 0 var(--gold)}
#introSvg .gr{stroke:#E8E2D2; stroke-width:5; stroke-linecap:round}
#introSkip{color:#B0A890; font-weight:700; font-size:13px}
.confetti{position:absolute; top:-14px; border-radius:2px;
  animation:confetti-fall linear forwards}
@keyframes confetti-fall{
  to{transform:translateY(105vh) rotate(680deg)}
}
</style>
</head>
<body>
<div id="splash">
  <div id="introTitle">⭐ Tumbling-Star</div>
  <svg id="introSvg" viewBox="0 0 220 150"></svg>
  <div id="introSkip">Tippen zum Überspringen</div>
</div>
<div id="app"></div>
<script>
/* ============ Daten ============ */
const C = {gold:"#C9A227", ink:"#191621", warn:"#E2654F"};

const TRACKS = {
  bruecke:{label:"Brücke halten", stepAfter:2, levels:[
    {sec:10,note:"3 Durchgänge"},{sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"}]},
  handstand:{label:"Handstand an der Wand", stepAfter:2, levels:[
    {sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"},{sec:30,note:"3 Durchgänge"}]},
  hollow:{label:"Hollow Body (Bananenlage)", stepAfter:2, levels:[
    {sec:10,note:"3 Durchgänge"},{sec:15,note:"3 Durchgänge"},{sec:20,note:"3 Durchgänge"}]},

  bogengang:{label:"Bogengang-Linie", stepAfter:3, levels:[

    {name:"Bogengang rückwärts mit Spotter", note:"5 Versuche"},
    {name:"Bogengang mit wenig Hilfe", note:"5 Versuche"},
    {name:"Bogengang allein", note:"5 Versuche", gate:"m6"}]}

const TRACK_KEYS = Object.keys(TRACKS);

const DAYS = [
  {id:"A", name:"Brücken-Tag", emoji:"🌈", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", items:[
      {name:"20 Hampelmänner"},
      {name:"Armkreisen groß", note:"10x vor + zurück"},
      {name:"Katze-Kuh auf der Matte", note:"8x langsam"},
      {name:"Handgelenke kreisen", note:"10x pro Seite"}]},
    {title:"Dehnen – lange halten!", items:[
      {name:"Schulterdehnung an der Wand", sec:30},
      {name:"Ausfallschritt-Dehnung", sec:30, sides:true},
      {name:"Kobra-Dehnung", sec:30},
      {track:"spagat"}]},
    {title:"Brücken-Drills", items:[
      {track:"bruecke"},
      {name:"Brücke vor- und zurückwippen", note:"10x"},
      {name:"Brücke: Wand runterlaufen", note:"3x"},
      {track:"bogengang"}]},
    {title:"Abschluss", items:[
      {name:"5x Rad – Landung stehen!", note:"Beine strecken"},
      {name:"3x Lieblingssprung", note:"Toe Touch / Tuck"},
      {name:"Sitz-Sprung-Haltung", note:"3x 3 Sek halten", minTL:2},
      {name:"Brücken-Kick-over", note:"3 Versuche, mit Spotter!", minTL:4}]}
  ]},
  {id:"B", name:"Kraft-Tag", emoji:"💪", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", items:[
      {name:"Hopserlauf auf der Stelle", sec:30},
      {name:"Bärengang", note:"2x durchs Zimmer"},
      {name:"Schulterkreisen", note:"10x pro Richtung"},
      {name:"10 Kniebeugen"}]},
    {title:"Kraft", items:[
      {track:"handstand"},{track:"hollow"},{track:"pushup"},{track:"superman"},{track:"plank"}]},
    {title:"Dehnen – lange halten!", items:[
      {name:"Schmetterling-Sitz", sec:30},
      {name:"Beinrückseite dehnen", sec:30, sides:true},
      {name:"Handgelenk-Dehnung", sec:30}]},
    {title:"Abschluss", items:[
      {name:"Handstand-Versuche mit Spotter", note:"5 Versuche"},
      {name:"3x Radschlag sauber"},
      {name:"Tuck-Sprünge", note:"2x 5", minTL:2},
      {name:"Candlestick-to-Stand", note:"5x", minTL:3},
      {name:"Einbeiniger Absprung", note:"10x pro Seite", minTL:4}]}
  ]},
  {id:"C", name:"Technik-Tag", emoji:"🤸", color:C.gold, tint:"#FFFFFF", sections:[
    {title:"Aufwärmen", items:[
      {name:"20 Strecksprünge"},
      {name:"Toe-Touch-Vorbereitung", note:"5x locker"},
      {name:"Handgelenke kreisen", note:"10x pro Seite"},
      {name:"Katze-Kuh auf der Matte", note:"8x langsam"}]},
    {title:"Tumbling-Technik", items:[
      {name:"5x Rad – Landung stehen!", note:"Beine strecken"},
      {name:"5x Radschlag sauber"},
      {name:"3x Radwende", note:"Füße zusammen landen"},
      {name:"Radwende + Strecksprung", note:"3x"},
      {name:"Spreizsprung (Star)", note:"3x", minTL:2},
      {name:"Pike-Sprung", note:"3x", minTL:3},
      {name:"Hurdler", note:"je Seite 3x", minTL:5}]},
    {title:"Bogengang-Drills", items:[
      {track:"bogengang"},
      {name:"Ein Bein in der Brücke heben", note:"je Bein 5x"}]},
    {title:"Dehnen – lange halten!", items:[
      {track:"spagat"},{track:"bruecke"},
      {name:"Schulterdehnung an der Wand", sec:30}]}
  ]}
];

const MILESTONES = [
  {id:"m1", name:"Brücke 15 Sekunden halten"},
  {id:"m2", name:"Wand komplett runterlaufen"},
  {id:"m3", name:"Handstand 20 Sek. an der Wand"},
  {id:"m4", name:"Spagat fast ganz unten"},
  {id:"m5", name:"Bogengang mit wenig Hilfe"},
  {id:"m6", name:"Trainer-Okay: Bogengang allein üben"}
];

/* CCVD level ladder (tumbling, derived from the CCVD rules summary sheet) + jump progression */
const FF_DRILLS = [
  {name:"Sitz-Sprung-Haltung", demo:"ffdrillsitz"},
  {name:"Handstütz-Schnepper an der Wand", demo:"ffdrillschnepper"},
  {name:"Brücken-Kick-over", demo:"ffdrillkickover"},
  {name:"Core-Spannung (Hollow)", demo:"hollow"}
];
const LEVELS = [
  {id:"L0", name:"Level 0", skills:[
    {id:"t0a", name:"Rolle vorwärts", cat:"heim", demo:"rollevw"},
    {id:"t0b", name:"Rolle rückwärts", cat:"heim", demo:"rollerw"},
    {id:"t0c", name:"Handstand an der Wand", cat:"heim", demo:"handstand"},
    {id:"t0d", name:"Rad", cat:"heim", demo:"rad"},
    {id:"t0e", name:"Radwende (einzeln)", cat:"heim", demo:"radwende"},
    {id:"t0f", name:"Brücke", cat:"heim", demo:"bruecke"}]},
  {id:"L1", name:"Level 1", skills:[
    {id:"t1a", name:"Bogengang rückwärts", cat:"heim", note:"mit Spotter!", demo:"bogengang"},
    {id:"t1b", name:"Bogengang vorwärts", cat:"heim", note:"mit Spotter!", demo:"bogengangvw"},
    {id:"t1c", name:"Brücke aus dem Stand + Aufstehen", cat:"heim", note:"mit Spotter!", demo:"brueckestand"},
    {id:"t1d", name:"Handstand-Abrollen", cat:"heim", demo:"handstandabrollen"}]},
  {id:"L2", name:"Level 2", skills:[
    {id:"t2a", name:"Rad-Radwende-Kombination", cat:"heim", demo:"radkombi"},
    {id:"t2b", name:"Standing Flick-Flack (1x)", cat:"drill", demo:"ff", drills:FF_DRILLS},
    {id:"t2c", name:"Running Flick-Flack nach Radwende", cat:"drill", demo:"ff", drills:FF_DRILLS}]},
  {id:"L3", name:"Level 3", skills:[
    {id:"t3a", name:"Flick-Flack-Serien", cat:"verein", demo:"ff"},
    {id:"t3b", name:"Sprung + Flick-Flack", cat:"verein", demo:"ff"},
    {id:"t3c", name:"Freies Rad (Aerial)", cat:"drill", demo:"aerial", drills:[
      {name:"Rad mit spätem Handaufsatz", demo:"aerialdrillspaet"},
      {name:"Rad über Erhöhung", demo:"aerialdrillerhoehung"},
      {name:"Einbeiniger Absprung", demo:"aerialdrillabsprung"}]},
    {id:"t3d", name:"3/4 Front Flip", cat:"verein", demo:"tuck"},
    {id:"t3e", name:"Running Flip gehockt", cat:"verein", note:"aus Radwende / RW-Flick-Flack", demo:"tuck"}]},
  {id:"L4", name:"Level 4", skills:[
    {id:"t4a", name:"Standing Tuck (1x)", cat:"drill", demo:"tuck", drills:[
      {name:"Tuck-Sprünge", demo:"tuckdrillsprung"},
      {name:"Candlestick-to-Stand", demo:"tuckdrillcandle"},
      {name:"Sprungkraft (Strecksprünge)", demo:"strecksprung"}]},
    {id:"t4b", name:"Running Flips", cat:"verein", demo:"tuck"}]},
  {id:"L5", name:"Level 5", skills:[
    {id:"t5a", name:"Sprung + Flip", cat:"verein", demo:"tuck"},
    {id:"t5b", name:"Flip mit bis zu 1 Twist (Full)", cat:"verein", demo:"tuck"}]},
  {id:"J", name:"Sprünge", skills:[
    {id:"j1a", name:"J1: Strecksprung", cat:"heim", demo:"strecksprung"},
    {id:"j1b", name:"J1: Hocksprung (Tuck-Sprung)", cat:"heim", demo:"tuckdrillsprung"},
    {id:"j2", name:"J2: Spreizsprung (Star)", cat:"heim", demo:"jumpstar"},
    {id:"j3a", name:"J3: Toe Touch (Ansatz)", cat:"heim", demo:"toetouch"},
    {id:"j3b", name:"J3: Pike (Ansatz)", cat:"heim", demo:"jumppike"},
    {id:"j4", name:"J4: Toe Touch & Pike mit Höhe", cat:"heim", demo:"toetouch"},
    {id:"j5", name:"J5: Hurdler", cat:"heim", demo:"jumphurdler"},
    {id:"j6", name:"J6: Sprung-Kombination (2 in Folge)", cat:"heim", demo:"jumpkombi"},
    {id:"j7", name:"J7: Sprung + Flick-Flack", cat:"verein", demo:"ff"}]}
];
/* Skill lines: complete ladders from first drill to the CCVD target skill.
   Home steps are trainable, club steps are confirm-only checkpoints. */
const LINES = [
  {id:"lnBG", name:"Bogengang-Linie", ziel:"CCVD Level 1", steps:[
    {id:"bg1", name:"Brücke von der Erhöhung", cat:"heim", demo:"bruecke",
     info:"Vom Sofa oder Kasten in die Brücke – so lernst du das Gefühl, ohne ganz tief runter zu müssen."},
    {id:"bg2", name:"Kick-over von der Erhöhung", cat:"heim", demo:"ffdrillkickover",
     info:"Ein Bein schwingt über dich rüber. Die Erhöhung macht den Weg kurz – mit Spotter üben!"},
    {id:"bg3", name:"Bogengang mit Spotter", cat:"heim", demo:"bogengang",
     info:"Jetzt die ganze Bewegung vom Boden – jemand hält dich dabei fest."},
    {id:"bg4", name:"Bogengang mit wenig Hilfe", cat:"heim", demo:"bogengang",
     info:"Der Spotter hilft nur noch ganz leicht. Du machst fast alles selbst!"},
    {id:"bg5", name:"Bogengang allein", cat:"verein", demo:"bogengang",
     info:"Der große Moment – aber erst, wenn dein Trainer das Okay gibt!"}]},
  {id:"lnFF", name:"Flick-Flack-Linie", ziel:"CCVD Level 2–3", steps:[
    {id:"ff1", name:"Sitz-Sprung-Haltung", cat:"heim", demo:"ffdrillsitz",
     info:"Absitzen wie auf einen Stuhl und explosiv strecken – genau so startet später der Flick-Flack."},
    {id:"ff2", name:"Handstütz-Schnepper", cat:"heim", demo:"ffdrillschnepper",
     info:"Im Handstand die Schultern lang drücken – das gibt dir später den Abdruck aus den Händen."},
    {id:"ff3", name:"Brücken-Kick-over", cat:"heim", demo:"ffdrillkickover",
     info:"Rückwärts über die Hände – die halbe Flick-Flack-Bewegung, schön langsam."},
    {id:"ff4", name:"Flick-Flack mit Spotter", cat:"verein", demo:"ff",
     info:"Im Verein: Der Trainer führt dich durch den Sprung rückwärts."},
    {id:"ff5", name:"Flick-Flack allein", cat:"verein", demo:"ff",
     info:"CCVD Level 2 geschafft, wenn der Trainer ihn dir freigibt!"},
    {id:"ff6", name:"Flick-Flack-Serien", cat:"verein", demo:"ff",
     info:"Mehrere hintereinander – Level 3!"},
    {id:"ff7", name:"Sprung + Flick-Flack", cat:"verein", demo:"ff",
     info:"Aus einem Sprung direkt in den Flick-Flack verbinden."}]},
  {id:"lnAE", name:"Aerial-Linie", ziel:"CCVD Level 3", steps:[

/* ============ Demos (skeletal stick-figure animations) ============ */
/* Rigid skeleton: fixed segment lengths, poses = joint angles (deg, 0=right, 90=down).
   Facing is shown by the feet only: toe segment sits on the anterior side (l+k+90*fs). */
const SK = {torso:36, uparm:20, forearm:18, upleg:27, loleg:25};
const DD = Math.PI/180;
function pt(x,y,a,len){ return [x+len*Math.cos(a*DD), y+len*Math.sin(a*DD)]; }
function seg(x1,y1,x2,y2,cls){
  return '<line class="'+cls+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)
    +'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
}
function armSVG(nx,ny,a,b,cls){
  const [ex,ey] = pt(nx,ny,a,SK.uparm);
  const [hx,hy] = pt(ex,ey,a+b,SK.forearm);
  return seg(nx,ny,ex,ey,cls)+seg(ex,ey,hx,hy,cls);
}
function legSVG(px,py,l,k,fs,cls){
  const [kx,ky] = pt(px,py,l,SK.upleg);
  const [fx,fy] = pt(kx,ky,l+k,SK.loleg);
  const [tx,ty] = pt(fx,fy,l+k+90*fs,10);
  return seg(px,py,kx,ky,cls)+seg(kx,ky,fx,fy,cls)+seg(fx,fy,tx,ty,cls);
}
/* Cheer character renderer: 2D vector puppet in the team look (black/gold CHEER
   outfit, brown ponytail), driven by the same joint-angle poses. */
const CH = {skin:"#F0BE9B", skinSh:"#D8A57F", top:"#26222E", topSh:"#1B1824",
  gold:"#D9B454", hair:"#4A2E1C", shoe:"#FFFFFF", shoeSh:"#DCD5E6", line:"#3A2E3F"};
function capLine(x1,y1,x2,y2,w,color){
  return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)
    +'" y2="'+y2.toFixed(1)+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>';
}
/* outlined capsule: dark contour underneath, fill color on top */
function cap(x1,y1,x2,y2,w,color){
  return capLine(x1,y1,x2,y2,w+2.6,CH.line)+capLine(x1,y1,x2,y2,w,color);
}
function charLeg(px,py,l,k,fs,shade,f){
  const [kx,ky] = pt(px,py,l,SK.upleg);
  const [ax,ay] = pt(kx,ky,l+k,SK.loleg);
  const [sx,sy] = pt(kx,ky,l+k,SK.loleg*0.7);
  const toe = (f==null) ? l+k+90*fs : f; // explicit foot angle (mocap) wins
  const [tx,ty] = pt(ax,ay,toe,11);
  const skin = shade?CH.skinSh:CH.skin, shoe = shade?CH.shoeSh:CH.shoe;
  return cap(px,py,kx,ky,7.5,skin)+cap(kx,ky,ax,ay,6.5,skin)
    +cap(sx,sy,ax,ay,6.8,shoe)+cap(ax,ay,tx,ty,8,shoe);
}
function charArm(nx,ny,a,b,shade){
  const [ex,ey] = pt(nx,ny,a,SK.uparm);
  const [wx,wy] = pt(ex,ey,a+b,SK.forearm);
  const top = shade?CH.topSh:CH.top, skin = shade?CH.skinSh:CH.skin;
  return cap(nx,ny,ex,ey,7,top)+cap(ex,ey,wx,wy,5.5,skin)
    +'<circle cx="'+wx.toFixed(1)+'" cy="'+wy.toFixed(1)+'" r="3.6" fill="'+skin
    +'" stroke="'+CH.line+'" stroke-width="1.6"/>';
}
function charSkirt(p){
  const u = [Math.cos(p.t*DD), Math.sin(p.t*DD)];
  // hem direction: away from the torso, blended toward gravity so the skirt hangs
  let hx = -u[0], hy = -u[1]+0.8;
  const hl = Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
  const v = [-hy, hx];
  const A = [p.px+v[0]*8, p.py+v[1]*8], B = [p.px-v[0]*8, p.py-v[1]*8];
  const H = [p.px+hx*13, p.py+hy*13];
  const C = [H[0]-v[0]*15, H[1]-v[1]*15], E = [H[0]+v[0]*15, H[1]+v[1]*15];
  const pts = [A,B,C,E].map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  return '<polygon points="'+pts+'" fill="'+CH.top+'" stroke="'+CH.line+'" stroke-width="2.4" stroke-linejoin="round"/>'
    + capLine(C[0],C[1],E[0],E[1],3,CH.gold);
}
function eyeSVG(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="3.1" fill="#fff"/>'
    +'<circle cx="'+x+'" cy="'+(y+0.4)+'" r="2" fill="#5A3521"/>'
    +'<circle cx="'+(x+0.7)+'" cy="'+(y-0.4)+'" r="0.7" fill="#fff"/>';
}
function charHead(nx,ny,p){
  const rot = p.t+90+p.hd;
  const face = p.flat ? 0 : (p.fs1>=0 ? -1 : 1);
  const [hx,hy] = pt(nx,ny,p.t+p.hd,16);
  const pf = face===0 ? 0 : -face; // ponytail sits behind the face; hidden in front view
  let s = '<g transform="translate('+hx.toFixed(1)+' '+hy.toFixed(1)+') rotate('+(rot).toFixed(1)+')">';
  if(pf){
    s += '<path d="M'+(pf*8)+',-8 q'+(pf*11)+',3 '+(pf*12)+',16" stroke="'+CH.line
      +'" stroke-width="9.4" fill="none" stroke-linecap="round"/>';
    s += '<path d="M'+(pf*8)+',-8 q'+(pf*11)+',3 '+(pf*12)+',16" stroke="'+CH.hair
      +'" stroke-width="7" fill="none" stroke-linecap="round"/>';
  }
  s += '<circle cx="0" cy="-2.5" r="12.3" fill="'+CH.hair+'" stroke="'+CH.line+'" stroke-width="2.2"/>';
  s += '<circle cx="'+(face*2.6)+'" cy="2.6" r="10.4" fill="'+CH.skin+'"/>';
  s += '<circle cx="'+(pf?pf*7.5:0)+'" cy="'+(pf?-9.5:-12.5)+'" r="3" fill="'+CH.gold+'"/>';
  if(face===0){
    s += eyeSVG(-4.4,1.5)+eyeSVG(4.4,1.5)
      +'<path d="M-2.8,7.2 q2.8,2.8 5.6,0" stroke="#7C4A32" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  } else {
    s += eyeSVG(face*5.2,1.5)
      +'<path d="M'+(face*7-2.4)+',7 q2.4,2.6 4.8,0.6" stroke="#7C4A32" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  }
  return s+'</g>';
}
function poseSVG(p){
  const [nx,ny] = pt(p.px,p.py,p.t,SK.torso);
  const u = [Math.cos(p.t*DD), Math.sin(p.t*DD)], v = [-u[1], u[0]];
  const wx = p.px+u[0]*7, wy = p.py+u[1]*7;
  const so = p.flat ? 7.5 : 2; // arms attach at the shoulders, not the sternum
  const s1x = nx+v[0]*so, s1y = ny+v[1]*so, s2x = nx-v[0]*so, s2y = ny-v[1]*so;
  let torso;
  if(p.bow){ // bendable spine: cat hump / hollow back
    const mx = (wx+nx)/2 + p.bow*Math.cos((p.t+90)*DD);
    const my = (wy+ny)/2 + p.bow*Math.sin((p.t+90)*DD);
    const dp = 'M'+wx.toFixed(1)+','+wy.toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)
      +' '+nx.toFixed(1)+','+ny.toFixed(1);
    torso = '<path d="'+dp+'" stroke="'+CH.line+'" stroke-width="15.6" fill="none" stroke-linecap="round"/>'
      +'<path d="'+dp+'" stroke="'+CH.top+'" stroke-width="13" fill="none" stroke-linecap="round"/>';
  } else {
    torso = cap(wx,wy,nx,ny,13,CH.top);
  }
  torso += cap(wx-u[0]*2+v[0]*6,wy-u[1]*2+v[1]*6, wx-u[0]*2-v[0]*6,wy-u[1]*2-v[1]*6, 2.5, CH.gold);
  const head = charHead(nx,ny,p);
  let s = '<ellipse cx="'+p.px.toFixed(1)+'" cy="139" rx="26" ry="4" fill="#E5DFCF"/>';
  s += charLeg(p.px,p.py,p.l2,p.k2,p.fs2,1,p.f2) + charArm(s2x,s2y,p.a2,p.b2,1);
  s += torso;
  if(p.headBack>=0.5) s += head; // head behind near limbs (e.g. hanging between arms)
  s += charLeg(p.px,p.py,p.l1,p.k1,p.fs1,0,p.f1);
  s += charSkirt(p);
  s += charArm(s1x,s1y,p.a1,p.b1,0);
  if(!(p.headBack>=0.5)) s += head;
  return s;
}
function KFS(list){
  return list.map(p=>Object.assign({bow:0,hd:0,b1:0,b2:0,k1:0,k2:0,fs1:1,fs2:1,flat:0,f1:null,f2:null,headBack:0}, p));
}
const easeIO = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const PKEYS = ["px","py","t","bow","hd","a1","b1","a2","b2","l1","k1","l2","k2","fs1","fs2","flat","f1","f2","headBack"];
function poseTween(d, u){
  const kf = d.kf;
  if(kf.length===1) return kf[0];
  const times = d.times || kf.map((_,i)=>i/(kf.length-1));
  let i=0; while(i<kf.length-2 && u>times[i+1]) i++;
  const t0=times[i], t1=times[i+1];
  const wr = Math.min(1,Math.max(0,(u-t0)/(t1-t0)));
  const w = d.lin ? wr : easeIO(wr); // mocap data plays linearly, hand-made poses eased
  const A=kf[i], B=kf[i+1], p={};
  for(const key of PKEYS){
    p[key] = (A[key]==null || B[key]==null) ? A[key] : A[key]+(B[key]-A[key])*w;
  }
  return p;
}

/* rAF driver: animates the single overlay svg (#demoAnim) */
let demoRAF = null, demoT0 = null;
function tickDemo(ts){
  const el = document.getElementById("demoAnim");
  const d = demoShown && DEMOS[demoShown];
  if(!el || !d){ demoRAF = null; return; }
  if(demoT0===null) demoT0 = ts;
  const dur = d.dur||2000, hold = d.hold!=null?d.hold:600;
  const u = Math.min(((ts-demoT0) % (dur+hold))/dur, 1);
  el.innerHTML = GROUND + (d.decor||"") + poseSVG(poseTween(d, u));
  demoRAF = requestAnimationFrame(tickDemo);
}
function startDemoAnim(){
  demoT0 = null;
  if(!demoRAF && demoShown) demoRAF = requestAnimationFrame(tickDemo);
}

/* ============ Logik ============ */
/* Training level scaling: plain hold timers grow +15% per level (track timers
   progress through their own step system instead) */
function tlSec(sec){ return Math.round(sec * (1 + 0.15*(store.tl-1)) / 5) * 5 || sec; }
function resolveItem(it){
  if(!it.track){
    const r = Object.assign({isTrack:false}, it);
    if(r.sec) r.sec = tlSec(r.sec);
    return r;
  }
  const tr = TRACKS[it.track];
  const p = store.progress[it.track];
  const lvl = Math.min(p.lvl, tr.levels.length-1);
  const d = tr.levels[lvl];
  return {name:d.name||tr.label, note:d.note, sec:d.sec, sides:tr.sides,
    isTrack:true, trackKey:it.track, lvl, maxLvl:tr.levels.length-1};
}
function ikey(d,s,i){ return d+"-"+s+"-"+i; }
function dayItems(sec){ return sec.items.filter(it => !(it.minTL > store.tl)); }
function dayKeys(day){
  const out=[]; day.sections.forEach((sec,s)=>dayItems(sec).forEach((_,i)=>out.push(ikey(day.id,s,i))));
  return out;
}

function toggleItem(k){
  if(timer && timer.key===k) stopTimer();
  checked[k] = !checked[k];
  render();
}

function startTimer(k, sec, ev){
  if(ev) ev.stopPropagation();
  clearInterval(timerInt);
  timer = {key:k, total:sec, left:sec};
  timerInt = setInterval(()=>{
    if(!timer) return;
    timer.left--;
    if(timer.left<=0){ timer.left=0; clearInterval(timerInt); checked[timer.key]=true; }
    renderTimer();
  },1000);
  render();
}
function stopTimer(){ clearInterval(timerInt); timer=null; render(); }
function restartTimer(ev){ ev.stopPropagation(); if(timer) startTimer(timer.key, timer.total); }

const TL_MAX = 5, TL_NEED = 3;
function finishTraining(){
  const day = DAYS.find(d=>d.id===dayId);
  if(!day) return;
  const tracksInDay = new Set();
  day.sections.forEach((sec,s)=>dayItems(sec).forEach((it,i)=>{
    if(it.track && checked[ikey(day.id,s,i)]) tracksInDay.add(it.track);
  }));
  const ups=[], gated=[];
  tracksInDay.forEach(t=>{
    const tr=TRACKS[t], p=store.progress[t];
    if(p.lvl >= tr.levels.length-1) return;
    p.cnt++;
    if(p.cnt >= tr.stepAfter){
      const nx = tr.levels[p.lvl+1];
      if(nx.gate && !store.milestones.includes(nx.gate)){ gated.push(tr.label); }
      else { p.lvl++; p.cnt=0; ups.push(nx.name || (tr.label+" – Stufe "+(p.lvl+1))); }
    }
  });
  store.unit[day.id] = (store.unit[day.id]||0) + 1;
  let tlUp = false;
  if(store.tl < TL_MAX && ["A","B","C"].every(d=>store.unit[d]>=TL_NEED)){
    store.tl++;
    store.unit = {A:0, B:0, C:0};
    tlUp = true;
  }
  saveStore();
  celebrate = {ups, gated, tlUp};
  checked = {};
  stopTimer();
}

function closeCelebrate(){ celebrate=null; dayId=null; tab="tracker"; render(); }
function toggleMs(id){
  const i = store.milestones.indexOf(id);
  if(i>=0) store.milestones.splice(i,1); else store.milestones.push(id);
  saveStore(); render();
}
function adjustLvl(t, delta){
  const tr=TRACKS[t], p=store.progress[t];
  p.lvl = Math.max(0, Math.min(tr.levels.length-1, p.lvl+delta));
  p.cnt = 0;
  saveStore(); render();
}
function resetAll(){
  store = {stars:[], milestones:[], progress:{}, levels:{}, tl:1, unit:{A:0,B:0,C:0}};
  TRACK_KEYS.forEach(k=>store.progress[k]={lvl:0,cnt:0});
  confirmReset=false; saveStore(); render();
}
function setTab(t){ tab=t; confirmReset=false; render(); }
function showDemo(key, ev){ if(ev) ev.stopPropagation(); demoShown=key; demoSkill=null; render(); }
function closeDemo(){ demoShown=null; demoSkill=null; render(); }
function toggleLevel(id){ levelOpen = levelOpen===id ? null : id; render(); }
function toggleLine(id){ lineOpen = lineOpen===id ? null : id; render(); }
function toggleLineStep(id){
  if(store.linesDone[id]) delete store.linesDone[id]; else store.linesDone[id]=true;
  saveStore(); render();
}
function showLineStep(lineId, stepId, ev){
  if(ev) ev.stopPropagation();
  const ln = LINES.find(l=>l.id===lineId);
  const st = ln && ln.steps.find(s=>s.id===stepId);
  if(st){ demoShown = st.demo; demoSkill = null; render(); }
}
function lineCurrent(ln){ return ln.steps.find(s=>!store.linesDone[s.id]) || null; }
function toggleSkill(id){
  if(store.levels[id]){ delete store.levels[id]; }
  else {
    store.levels[id]=true;
    const lv = LEVELS.find(l=>l.skills.some(s=>s.id===id));
    if(lv && lv.skills.every(s=>store.levels[s.id])) levelCelebrate = lv;
  }
  saveStore(); render();
}
function closeLevelCelebrate(){ levelCelebrate=null; render(); }
function levelDone(lv){ return lv.skills.every(s=>store.levels[s.id]); }
/* Highest fully completed tumbling level, e.g. "Level 1"; null if none */
function currentRank(){
  let rank = null;
  for(const lv of LEVELS){
    if(lv.id==="J") continue;
    if(levelDone(lv)) rank = lv; else break;
  }
  return rank;
}
function findSkill(id){
  for(const lv of LEVELS) for(const s of lv.skills) if(s.id===id) return s;
  return null;
}
function showSkill(id, ev){
  if(ev) ev.stopPropagation();
  demoSkill = findSkill(id);
  demoShown = demoSkill ? demoSkill.demo : null;
  render();
}
function openDay(id){ checked={}; dayId=id; render(); }
function backToDays(){ dayId=null; stopTimer(); }

/* ============ Render ============ */
function itemHTML(day, it, k){
  const on = !!checked[k];
  const badge = it.isTrack
    ? '<span class="lvl" style="background:'+day.color+'">Stufe '+(it.lvl+1)+'/'+(it.maxLvl+1)+'</span>' : '';
  const note = (it.note||it.sides)
    ? '<span class="inote">'+esc(it.note||'')+(it.note&&it.sides?' · ':'')+(it.sides?'je Seite!':'')+'</span>' : '';
  const tbtn = (it.sec && !on)
    ? '<span class="timerbtn" style="background:'+day.color+'" onclick="startTimer(\''+k+'\','+it.sec+',event)">⏱ '+it.sec+'s</span>' : '';
  const dk = demoFor(it);
  const dbtn = dk ? '<span class="demobtn" onclick="showDemo(\''+dk+'\',event)">👀</span>' : '';
  return '<button class="item'+(on?' done':'')+'" onclick="toggleItem(\''+k+'\')">'
    +'<span class="circle" style="border:2.5px solid '+day.color+'">'+(on?'✓':'')+'</span>'
    +'<span style="flex:1"><span class="iname">'+esc(it.name)+badge+'</span>'+note+'</span>'
    +'<span style="margin-left:auto;display:flex;gap:6px;align-items:center">'+dbtn+tbtn+'</span></button>';
}

function trainingHTML(){
  const day = DAYS.find(d=>d.id===dayId);
  if(!day){
    let h = '<div class="dayhead" style="background:var(--card);box-shadow:0 4px 0 var(--gold);margin-bottom:12px">'
      +'<span style="font-size:26px">🏋️</span>'
      +'<div style="flex:1"><div style="font-weight:900;font-size:15px">Trainings-Level '+store.tl+(store.tl>=TL_MAX?' (Maximum!)':'')+'</div>'
      +'<div style="font-size:12px;color:var(--sub)">Daran arbeiten wir: '+esc(TL_FOCUS[store.tl])+'</div>'
      +'<div style="font-size:11.5px;color:var(--sub)">Je 3× Tag A, B und C = nächstes Level</div></div></div>';
    h += '<p style="font-size:15px;font-weight:700;margin:4px 2px 10px">Such dir deinen Trainingstag aus:</p>';
    DAYS.forEach(d=>{
      const u = Math.min(store.unit[d.id]||0, TL_NEED);
      h += '<button class="daycard" style="background:'+d.tint+';box-shadow:0 4px 0 '+d.color+'" onclick="openDay(\''+d.id+'\')">'
        +'<span class="em">'+d.emoji+'</span><span><span class="nm">Tag '+d.id+': '+d.name+'</span>'
        +'<span class="in">'+'⭐'.repeat(u)+'☆'.repeat(TL_NEED-u)+' in diesem Level · ca. 25–30 Min</span></span>'
        +'<span class="ar" style="color:'+d.color+'">›</span></button>';
    });
    h += '<div class="safety"><b style="color:#8A6A0E">! SICHERHEIT:</b> Immer auf der Matte üben. Bogengang ohne Hilfe erst mit Trainer-Okay. Flick-Flack &amp; Salto: <b>nur im Verein!</b></div>';
    return h;
  }
  const keys = dayKeys(day);
  const done = keys.filter(k=>checked[k]).length;
  let h = '<button class="back" onclick="backToDays();render()">‹ Zurück zur Auswahl</button>';
  h += '<div class="dayhead" style="background:'+day.tint+';box-shadow:0 4px 0 '+day.color+'">'
    +'<span style="font-size:30px">'+day.emoji+'</span>'
    +'<div style="flex:1"><div style="font-weight:900;font-size:17px">Tag '+day.id+': '+day.name+'</div>'
    +'<div class="pbar"><div class="pfill" style="width:'+(done/keys.length*100)+'%;background:'+day.color+'"></div></div></div>'
    +'<div style="font-weight:900;font-size:14px">'+done+'/'+keys.length+'</div></div>';
  day.sections.forEach((sec,s)=>{
    h += '<div class="sectitle" style="background:'+day.color+'">'+esc(sec.title)+'</div>';
    dayItems(sec).forEach((raw,i)=>{
      const it = resolveItem(raw);
      if(raw.minTL === store.tl) it.note = (it.note ? it.note+' · ' : '')+'NEU in Level '+store.tl+'!';
      h += itemHTML(day, it, ikey(day.id,s,i));
    });
  });
  if(done===keys.length){
    h += '<button class="bigbtn" onclick="finishTraining();render()">⭐ Training abschließen &amp; Stern holen!</button>';
  }
  return h;
}

function trackerHTML(){
  const atMax = store.tl >= TL_MAX;
  let h = '<div class="goldbox" style="margin:0 0 14px">'
    +'<div style="font-size:30px">💪</div>'
    +'<div style="font-weight:900;font-size:18px">Trainings-Level '+store.tl+(atMax?' – Maximum!':'')+'</div>'
    +'<div style="font-size:13px;color:var(--sub)">'
    +(atMax ? 'Du bist ganz oben – bleib dran und halte dein Niveau!'
            : 'Sammle je '+TL_NEED+' Einheiten pro Trainingstag für Level '+(store.tl+1)+'!')
    +'</div></div>';
  h += '<div class="card">';
  DAYS.forEach(d=>{
    const u = store.unit[d.id]||0;
    h += '<div class="wrow"><div class="wlabel" style="background:'+d.color+'">Tag '+d.id+'</div><div class="slots">';
    for(let t=0; t<TL_NEED; t++){
      h += t < u
        ? '<button class="slot full">⭐<small>'+d.id+'</small></button>'
        : '<button class="slot">☆</button>';
    }
    h += '</div>'+(u>TL_NEED?'<span style="font-weight:900;font-size:12px;margin-left:8px;color:var(--sub)">+'+(u-TL_NEED)+' extra</span>':'')+'</div>';
  });
  h += '</div>';
  const missing = DAYS.reduce((acc,d)=>acc + Math.max(0, TL_NEED-(store.unit[d.id]||0)), 0);
  if(!atMax){
    h += '<div style="font-size:13px;color:var(--sub);text-align:center;margin-top:10px">Noch '
      +missing+' Einheit'+(missing===1?'':'en')+' bis Trainings-Level '+(store.tl+1)
      +' – dann steigen die Haltezeiten leicht und neue Übungen warten!</div>';
  }
  h += '<div style="text-align:center;margin-top:18px">'
    + (confirmReset
      ? '<button class="reset2" onclick="resetAll()">Wirklich alles löschen (Level, Ziele &amp; Stufen)?</button>'
      : '<button class="reset" onclick="confirmReset=true;render()">Alles zurücksetzen</button>')
    + '</div>';
  return h;
}

function levelHTML(){
  const lc = {L0:C.gold, L1:C.gold, L2:C.gold, L3:C.gold, L4:C.gold, L5:C.gold, J:C.gold};
  const rank = currentRank();
  let h = '<div class="goldbox" style="margin:0 0 12px">'
    +'<div style="font-size:28px">'+(rank?'🏅':'🌱')+'</div>'
    +'<div style="font-weight:900;font-size:16px">'+(rank?'Du hast '+esc(rank.name)+' geschafft!':'Dein Weg zu Level 0 beginnt!')+'</div>'
    +'<div style="font-size:13px;color:var(--sub)">'+(rank?'Weiter zum nächsten Level – Skill für Skill.':'Hak deine ersten Skills ab und hol dir dein erstes Level-Abzeichen!')+'</div></div>';
  h += '<p style="font-size:15px;font-weight:700;margin:4px 2px 8px">Deine Skill-Linien – vom ersten Drill bis zum großen Skill:</p>';
  LINES.forEach(ln=>{
    const done = ln.steps.filter(s=>store.linesDone[s.id]).length;
    const cur = lineCurrent(ln);
    const open = lineOpen===ln.id;
    const color = C.gold;
    h += '<div class="lvlcard"><button class="lvlhead" onclick="toggleLine(\''+ln.id+'\')">'
      +'<div style="flex:1"><div style="font-weight:900;font-size:14.5px">'+esc(ln.name)
      +' <span class="catb" style="background:'+C.gold+';color:var(--ink)">'+esc(ln.ziel)+'</span></div>'
      +'<div style="font-size:12px;color:var(--sub)">'+(cur ? 'Gerade dran: '+esc(cur.name) : 'Komplett! 🏅')+'</div></div>'
      +'<span style="font-weight:900;font-size:13px">'+done+'/'+ln.steps.length+'</span>'
      +'<span style="color:var(--sub);font-size:15px">'+(open?'▾':'▸')+'</span></button>';
    if(open){
      ln.steps.forEach((s2,i)=>{
        const on = !!store.linesDone[s2.id];
        const isCur = cur && cur.id===s2.id;
        const ci = CAT_INFO[s2.cat==="heim"?"heim":"verein"];
        h += '<button class="skillrow" onclick="toggleLineStep(\''+s2.id+'\')">'
          +'<span class="circle" style="border:2.5px solid '+color+(on?';background:#4C9A5F;border-color:#4C9A5F':'')+'">'+(on?'✓':(i+1))+'</span>'
          +'<span style="flex:1"><span class="iname" style="'+(on?'text-decoration:line-through;opacity:.6':'')+'">'
          +(s2.cat==="verein"?'🔒 ':'')+esc(s2.name)
          +'<span class="catb" style="background:'+ci.color+'">'+ci.label+'</span></span></span>'
          +'<span class="demobtn" onclick="showLineStep(\''+ln.id+'\',\''+s2.id+'\',event)">👀</span></button>';
        if(isCur){
          h += '<div style="margin:0 14px 8px 50px;background:#FFF6DB;border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.45">'
            +'<b>⭐ Daran arbeitest du:</b> '+esc(s2.info)
            +(s2.cat==="verein"?' <b>Nur im Verein!</b>':'')+'</div>';
        }
      });
    }
    h += '</div>';
  });
  h += '<p style="font-size:15px;font-weight:700;margin:16px 2px 8px">CCVD-Checkliste – hak ab, was sicher sitzt:</p>';
  h += '<div style="font-size:11.5px;color:var(--sub);margin:0 2px 12px;line-height:1.7">'
    +'<span class="catb" style="background:'+CAT_INFO.heim.color+'">Zuhause</span> frei üben &nbsp;'
    +'<span class="catb" style="background:'+CAT_INFO.drill.color+'">Drills zuhause</span> nur die Vorbereitung üben &nbsp;'
    +'<span class="catb" style="background:'+CAT_INFO.verein.color+'">Nur Verein</span> abhaken, wenn der Trainer es bestätigt</div>';
  LEVELS.forEach(lv=>{
    const color = lc[lv.id] || C.gold;
    const done = lv.skills.filter(s=>store.levels[s.id]).length;
    const open = levelOpen===lv.id;
    h += '<div class="lvlcard"><button class="lvlhead" onclick="toggleLevel(\''+lv.id+'\')">'
      +'<span class="lvlbadge" style="background:'+color+'">'+esc(lv.name)+'</span>'
      +'<div style="flex:1"><div class="pbar" style="background:#F2EEE3"><div class="pfill" style="width:'+(done/lv.skills.length*100)+'%;background:'+color+'"></div></div></div>'
      +'<span style="font-weight:900;font-size:13px">'+(done===lv.skills.length?'🏅':done+'/'+lv.skills.length)+'</span>'
      +'<span style="color:var(--sub);font-size:15px">'+(open?'▾':'▸')+'</span></button>';
    if(open){
      lv.skills.forEach(s=>{
        const on = !!store.levels[s.id];
        const ci = CAT_INFO[s.cat];
        h += '<button class="skillrow" onclick="toggleSkill(\''+s.id+'\')">'
          +'<span class="circle" style="border:2.5px solid '+color+(on?';background:#4C9A5F;border-color:#4C9A5F':'')+'">'+(on?'✓':'')+'</span>'
          +'<span style="flex:1"><span class="iname" style="'+(on?'text-decoration:line-through;opacity:.6':'')+'">'+esc(s.name)
          +'<span class="catb" style="background:'+ci.color+'">'+ci.label+'</span></span>'
          +(s.note?'<span class="inote">'+esc(s.note)+'</span>':'')+'</span>'
          +'<span class="demobtn" onclick="showSkill(\''+s.id+'\',event)">👀</span></button>';

    h += '</div>';
  });
  h += '<div class="lvlcard" style="padding:12px 14px;font-size:13px;color:var(--sub)">'
    +'<b style="color:var(--ink)">Level 6 &amp; 7:</b> Im Tumbling wie Level 5 – die Unterschiede liegen bei den Stunts im Verein.</div>';
  h += '<div class="safety"><b style="color:#8A6A0E">! SICHERHEIT:</b> Skills mit '
    +'<span class="catb" style="background:'+CAT_INFO.drill.color+'">Drills zuhause</span> oder '
    +'<span class="catb" style="background:'+CAT_INFO.verein.color+'">Nur Verein</span> lernst du ausschließlich im Verein mit Trainer – zuhause nur die gezeigten Vorbereitungs-Übungen!</div>';
  return h;
}

function zieleHTML(){
  let h = '<p style="font-size:15px;font-weight:700;margin:4px 2px 10px">Hak ab, was du schon kannst:</p>';
  MILESTONES.forEach(m=>{
    const on = store.milestones.includes(m.id);
    h += '<button class="item'+(on?' done':'')+'" onclick="toggleMs(\''+m.id+'\')">'
      +'<span class="circle" style="border:2.5px solid var(--gold)">'+(on?'✓':'')+'</span>'
      +'<span class="iname" style="flex:1">'+esc(m.name)+'</span>'
      +(on?'<span>🏆</span>':'')+'</button>';
  });
  h += '<div class="sectitle" style="background:var(--gold)">Deine Stufen</div>';
  h += '<p style="font-size:12.5px;color:var(--sub);margin:0 2px 8px">Übungen steigen automatisch, wenn du sie oft genug im Training gemacht hast. Eltern können hier anpassen (+/–).</p>';
  TRACK_KEYS.forEach(t=>{
    const tr=TRACKS[t], p=store.progress[t];
    const def=tr.levels[Math.min(p.lvl,tr.levels.length-1)];
    const atMax = p.lvl>=tr.levels.length-1;
    const nextGated = !atMax && tr.levels[p.lvl+1].gate && !store.milestones.includes(tr.levels[p.lvl+1].gate);
    let dots='';
    for(let i=0;i<tr.stepAfter;i++) dots += '<span class="dot'+(i<p.cnt?' on':'')+'"></span>';
    const cur = def.name ? esc(def.name)+(def.sec?' ('+def.sec+' Sek.)':'')
      : (def.sec ? def.sec+' Sek.' : esc(def.note||''));
    const status = atMax ? 'Höchste Stufe! 🏆'
      : nextGated ? '🔒 wartet auf Trainer-Okay'
      : p.cnt+'/'+tr.stepAfter+' bis zur nächsten Stufe';
    h += '<div class="track"><div style="flex:1">'
      +'<div style="font-weight:800;font-size:14px">'+esc(tr.label)
      +' <span class="lvl" style="background:var(--gold)">Stufe '+(p.lvl+1)+'/'+tr.levels.length+'</span></div>'
      +'<div style="font-size:12.5px;color:var(--sub)">Aktuell: '+cur+'</div>'
      +'<div class="dots">'+dots+'<span style="font-size:11px;color:var(--sub);margin-left:4px">'+status+'</span></div>'
      +'</div><div style="display:flex;flex-direction:column;gap:4px">'
      +'<button class="pm" onclick="adjustLvl(\''+t+'\',1)">+</button>'
      +'<button class="pm" onclick="adjustLvl(\''+t+'\',-1)">–</button>'
      +'</div></div>';
  });
  h += '<div class="safety"><b style="color:#8A6A0E">Denk dran:</b> „Bogengang allein" wird erst freigeschaltet, wenn das <b>Trainer-Okay</b> oben abgehakt ist. Und Flick-Flack &amp; Salto lernst du <b>nur im Verein!</b></div>';
  return h;
}

function overlaysHTML(){
  let h='';
  if(demoShown && DEMOS[demoShown]){
    const d = DEMOS[demoShown];
    let extra = '';
    if(demoSkill && demoSkill.cat!=="heim"){
      extra += '<div class="warnbox">⚠️ Diesen Skill lernst du NUR im Verein mit Trainer!'
        +(demoSkill.drills?' Zuhause darfst du diese Drills üben:':'')+'</div>';
    }
    if(demoSkill && demoSkill.drills){
      extra += demoSkill.drills.map(dr=>
        '<button class="drillbtn" onclick="showDemo(\''+dr.demo+'\',event)">👀 '+esc(dr.name)+'</button>').join('');
    }
    h += '<div class="overlay" onclick="closeDemo()"><div class="democard">'
      + '<svg id="demoAnim" class="demo-svg" viewBox="0 0 220 150"></svg>'
      + '<div style="font-weight:900;font-size:18px;margin-top:8px">'+esc(d.title)+'</div>'
      + '<ul class="demotips">'+d.tips.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'
      + extra
      + '<div style="color:var(--sub);font-size:13px;margin-top:10px">Tippen zum Schließen</div>'
      + '</div></div>';
  }
  if(levelCelebrate){
    h += '<div class="overlay" onclick="closeLevelCelebrate()">'
      +'<div style="font-size:84px">🏅</div>'
      +'<div style="color:#fff;font-size:26px;font-weight:900;margin-top:6px">'+esc(levelCelebrate.name)+' geschafft!</div>'
      +'<div style="color:#EFE7D8;font-size:15px;margin-top:10px;max-width:300px">Alle Skills sitzen – du bist ein Tumbling-Star! ⭐⭐⭐</div>'
      +'<div style="color:#B0A890;font-size:13px;margin-top:14px">Tippen zum Weitermachen</div></div>';
  }
  if(timer){
    h += '<div class="overlay" id="timerOverlay" onclick="stopTimer()"></div>';
  }
  if(celebrate){
    let ups='', gated='';
    if(celebrate.ups.length){
      ups = '<div style="background:var(--gold);color:var(--ink);border-radius:16px;padding:12px 16px;margin-top:14px;font-weight:800;font-size:15px;max-width:320px">⬆️ Neue Stufe!'
        + celebrate.ups.map(u=>'<div style="font-size:14px;font-weight:700;margin-top:4px">'+esc(u)+'</div>').join('') + '</div>';
    }
    if(celebrate.gated.length){
      gated = '<div style="background:var(--goldPale);color:var(--ink);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:13.5px;max-width:320px">🔒 Die nächste Bogengang-Stufe wartet auf das <b>Trainer-Okay</b> (im Ziele-Tab abhaken).</div>';
    }
    const missing = DAYS.reduce((acc,d)=>acc + Math.max(0, TL_NEED-(store.unit[d.id]||0)), 0);
    const sub = celebrate.tlUp
      ? 'Haltezeiten steigen leicht – und neue Übungen sind freigeschaltet!'
      : (store.tl>=TL_MAX ? 'Maximal-Level – weiter so!' : 'Noch '+missing+' Einheit'+(missing===1?'':'en')+' bis Trainings-Level '+(store.tl+1)+'!');
    h += '<div class="overlay" onclick="closeCelebrate()">'
      +'<div style="font-size:84px">'+(celebrate.tlUp?'🏆':'⭐')+'</div>'
      +'<div style="color:#fff;font-size:26px;font-weight:900;margin-top:6px">'
      +(celebrate.tlUp?'Trainings-Level '+store.tl+' erreicht!':'Training geschafft!')+'</div>'
      + ups + gated
      +'<div style="color:#EFE7D8;font-size:15px;margin-top:12px;max-width:300px">'+sub+'</div>'
      +'<div style="color:#B0A890;font-size:13px;margin-top:14px">Tippen zum Weitermachen</div></div>';
  }
  return h;
}

function renderTimer(){
  const el = document.getElementById("timerOverlay");
  if(!el || !timer) return;
  const done = timer.left===0;
  const deg = (1 - timer.left/timer.total) * 360;
  el.innerHTML =
    '<div class="ring" style="background:conic-gradient(var(--gold) '+deg+'deg, #3E3947 0deg)">'
    +'<div class="ringin"><div class="tnum">'+(done?'⭐':timer.left)+'</div>'
    +'<div style="font-size:14px;opacity:.8">'+(done?'Geschafft!':'Sekunden')+'</div></div></div>'
    +'<div style="color:#fff;margin-top:18px;font-size:15px;font-weight:700">'
    +(done?'Tippen zum Schließen':'Halten … du schaffst das!')+'</div>'
    +(done?'<button onclick="restartTimer(event)" style="margin-top:14px;border:none;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;background:var(--gold);color:var(--ink)">🔁 Nochmal (andere Seite)</button>':'');
}

function render(){
  const app = document.getElementById("app");
  let h = '<h1>⭐ Tumbling-Star</h1><p class="sub">Dein Weg zum Bogengang – Stufe für Stufe</p>';
  h += '<div class="tabs">'
    +'<button class="tab'+(tab==="training"?' on':'')+'" onclick="setTab(\'training\')">🏋️ Training</button>'
    +'<button class="tab'+(tab==="tracker"?' on':'')+'" onclick="setTab(\'tracker\')">⭐ Sterne</button>'
    +'<button class="tab'+(tab==="level"?' on':'')+'" onclick="setTab(\'level\')">🤸 Level</button>'
    +'<button class="tab'+(tab==="ziele"?' on':'')+'" onclick="setTab(\'ziele\')">🏆 Ziele</button></div>';
  if(tab==="training") h += trainingHTML();
  else if(tab==="tracker") h += trackerHTML();
  else if(tab==="level") h += levelHTML();
  else h += zieleHTML();
  h += overlaysHTML();
  app.innerHTML = h;
  renderTimer();
  startDemoAnim();
}
render();

/* Intro splash: the character tumbles a full pass (cartwheel+round-off,
   flick-flack, star jump with confetti), then the splash fades into the app.
   Tap anywhere to skip. Reuses the demo keyframes and renderer. */
(function(){
  const sp = document.getElementById("splash");
  const svg = document.getElementById("introSvg");
  if(!sp || !svg){ return; }
  const SEQ = [DEMOS.radkombi, DEMOS.ff, DEMOS.jumpstar];
  const PAUSE = 260, OUTRO = 1100;
  const total = SEQ.reduce((s,d)=>s+d.dur+PAUSE, 0);
  let raf = null, t0 = null, confettiDone = false;
  function confetti(){
    const colors = ["#C9A227","#E7C463","#FFFFFF","#FFF6DB"];
    for(let i=0;i<22;i++){
      const c = document.createElement("div");
      c.className = "confetti";
      const s = 5+(i%3)*3;
      c.style.cssText = "left:"+(3+(i*4.3)%94)+"vw;width:"+s+"px;height:"+(s*1.5)
        +"px;background:"+colors[i%4]+";animation-duration:"+(1.5+(i%5)*.22)
        +"s;animation-delay:"+((i%7)*.09)+"s";
      sp.appendChild(c);
    }
  }
  function close(){
    if(raf) cancelAnimationFrame(raf);
    sp.classList.add("out");
    setTimeout(()=>{ sp.remove(); }, 500);
  }
  function tick(ts){
    if(t0===null) t0 = ts;
    let t = ts-t0;
    if(t >= total+OUTRO){ close(); return; }
    let d = SEQ[SEQ.length-1], u = 1;
    for(const seg of SEQ){
      if(t < seg.dur+PAUSE){ d = seg; u = Math.min(t/seg.dur, 1); break; }
      t -= seg.dur+PAUSE;
    }
    if(d===SEQ[SEQ.length-1] && !confettiDone && u>=.3){ confettiDone = true; confetti(); }
    svg.innerHTML = GROUND + poseSVG(poseTween(d, u));
    raf = requestAnimationFrame(tick);
  }
  sp.addEventListener("click", close);
  try { raf = requestAnimationFrame(tick); } catch(e){ close(); }
})();
</script>
</body>
</html>
